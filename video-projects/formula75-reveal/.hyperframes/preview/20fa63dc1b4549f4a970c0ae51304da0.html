    <!--
      Formula 75 reveal — behind-the-subject product graphics for the end of the
      NPC - Youtube intro (last clip of "YouTube – Edit 01", source 89.9–98.0s, trimmed by Ash).
      Layers, back to front: plate (Ash's footage) → stage darkening + light →
      jar / ingredient panel / title → fg.webm (Ash cut out by the Vision person
      matte, alpha) so every graphic sits behind him and his hands pass in front.
      Graphics zone x 60–720: Ash's head never goes left of x≈770 in this clip.
      Word timings (local s): "new product" 2.46, "JP" 3.0, "review" 6.1,
      "insight" ~6.9, "shortly" ~7.4, clip ends 8.1 (243 frames).
    -->
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: Montserrat, sans-serif; }
      #plate-wrap, #fg-wrap { position: absolute; inset: 0; }
      #plate, #fg { width: 1920px; height: 1080px; object-fit: cover; }
      #plate-wrap { z-index: 0; }
      #fg-wrap { z-index: 20; }

      /* stage: darkens the bright sky/park on the left so the product reads; Ash stays bright on top */
      #dim {
        position: absolute; inset: 0; z-index: 1; pointer-events: none;
        /* anchored on the left edge so it reads as a lit side-stage, not a grey blob in the sky */
        background:
          radial-gradient(ellipse 46% 95% at 0% 50%, rgba(5, 8, 12, 0.9) 0%, rgba(5, 8, 12, 0.72) 55%, rgba(5, 8, 12, 0) 100%),
          radial-gradient(ellipse 40% 60% at 22% 100%, rgba(5, 8, 12, 0.5) 0%, rgba(5, 8, 12, 0) 100%);
      }
      #beam {
        position: absolute; left: 150px; width: 480px; top: 0; bottom: 0; z-index: 2; pointer-events: none;
        background: radial-gradient(ellipse 50% 92% at 50% 100%, rgba(111, 195, 238, 0.34) 0%, rgba(111, 195, 238, 0.12) 45%, rgba(111, 195, 238, 0) 75%);
        mix-blend-mode: screen; transform-origin: 50% 100%;
      }
      #floorglow {
        position: absolute; left: -60px; width: 900px; bottom: -150px; height: 330px; z-index: 2; pointer-events: none;
        background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(111, 195, 238, 0.55) 0%, rgba(95, 211, 138, 0.22) 45%, rgba(95, 211, 138, 0) 72%);
        mix-blend-mode: screen;
      }
      #slit {
        position: absolute; left: 70px; width: 640px; bottom: 6px; height: 4px; z-index: 6; border-radius: 4px;
        background: linear-gradient(90deg, rgba(111,195,238,0), #e9f7ff 30%, #ffffff 50%, #e9f7ff 70%, rgba(111,195,238,0));
        box-shadow: 0 0 18px 4px rgba(111, 195, 238, 0.9), 0 0 60px 16px rgba(111, 195, 238, 0.45);
      }
      #ring {
        position: absolute; left: 130px; width: 520px; bottom: 0; height: 110px; z-index: 3; border-radius: 50%;
        border: 3px solid rgba(160, 220, 248, 0.9);
        box-shadow: 0 0 24px rgba(111, 195, 238, 0.8), inset 0 0 24px rgba(111, 195, 238, 0.5);
        transform: translateY(55px);
      }
      .spark {
        position: absolute; bottom: 8px; width: 6px; height: 6px; border-radius: 50%; z-index: 4;
        background: #dff4ff; box-shadow: 0 0 10px 2px rgba(111, 195, 238, 0.9);
      }
      .spark.g { background: #e3ffef; box-shadow: 0 0 10px 2px rgba(95, 211, 138, 0.9); }

      /* title block — top of the graphics zone */
      #title { position: absolute; left: 72px; top: 64px; width: 650px; height: 170px; z-index: 8; }
      .kicker {
        position: absolute; left: 4px; top: 0; white-space: nowrap;
        font-weight: 600; font-size: 27px; letter-spacing: 0.34em; color: #e6f5fc;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.85), 0 0 18px rgba(111, 195, 238, 0.55);
      }
      #wordmark { position: absolute; left: 0; top: 40px; white-space: nowrap; font-size: 96px; line-height: 1; letter-spacing: 0.02em; }
      #wm-a {
        display: inline-block; font-weight: 300;
        background: linear-gradient(180deg, #ffffff 0%, #e8edf1 45%, #9aa3ab 78%, #d9dee2 100%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
        filter: drop-shadow(0 0 22px rgba(255, 255, 255, 0.22));
      }
      #wm-b {
        display: inline-block; font-weight: 800; margin-left: 6px;
        background: linear-gradient(180deg, #e9f7ff 0%, #8fd3f3 45%, #4ea9d8 100%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
        filter: drop-shadow(0 0 24px rgba(111, 195, 238, 0.7));
      }
      #rule {
        position: absolute; left: 4px; top: 150px; width: 420px; height: 2px;
        background: linear-gradient(90deg, #8fd3f3, rgba(95, 211, 138, 0.8) 60%, rgba(95, 211, 138, 0));
        transform-origin: 0 50%;
      }

      /* ingredient panel — rises in beat 2, angled toward Ash */
      #panel-stage { position: absolute; left: 118px; top: 262px; width: 560px; height: 574px; z-index: 5; perspective: 1400px; }
      #panel {
        position: absolute; inset: 0; transform-origin: 0% 50%; transform: rotateY(12deg);
        border-radius: 30px; overflow: hidden;
        box-shadow: 0 40px 90px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(160, 220, 248, 0.35), 0 0 50px rgba(111, 195, 238, 0.35);
      }
      #panel img { width: 100%; height: 100%; display: block; }
      #scan {
        position: absolute; left: 0; right: 0; top: 0; height: 90px; mix-blend-mode: screen;
        background: linear-gradient(180deg, rgba(111, 195, 238, 0) 0%, rgba(160, 225, 250, 0.42) 50%, rgba(111, 195, 238, 0) 100%);
      }

      /* the jar — hero of beat 1, callback in front of the panel in beat 2 */
      #jar-pos { position: absolute; left: 114px; top: 230px; width: 552px; height: 700px; z-index: 7; }
      #jar-bob { position: absolute; inset: 0; }
      #jar { position: absolute; inset: 0; width: 552px; height: 700px; filter: drop-shadow(0 30px 40px rgba(0, 0, 0, 0.65)) drop-shadow(0 0 30px rgba(111, 195, 238, 0.28)); }
      #jar-shine {
        position: absolute; inset: 0;
        -webkit-mask-image: url(assets/jar.png); -webkit-mask-size: 100% 100%;
        mask-image: url(assets/jar.png); mask-size: 100% 100%;
        background: linear-gradient(105deg, rgba(255,255,255,0) 35%, rgba(255,255,255,0.55) 48%, rgba(190,235,255,0.25) 53%, rgba(255,255,255,0) 62%);
        background-size: 300% 100%; background-position: 120% 0; mix-blend-mode: screen;
      }
