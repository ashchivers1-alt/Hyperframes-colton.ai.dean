<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <!--
      Shows clash — behind-the-subject show posters for the NPC - Youtube intro
      (source 8.0–33.6s, inside the first clip of "YouTube – Edit 01").
      Layers, back to front: plate → stage darkening + light → posters/labels/stamp
      → fg.webm (Ash cut out by the Vision person matte, alpha).
      Graphics zone x 40–760: Ash's head/shoulders stay right of x≈830 here.
      Word timings (local s = source − 8): "NPC" 1.16, "two bros" 1.66, "Bradford" 4.68,
      "PCA" 6.87, "Telford" 8.67, "same weekend" 14.32, "same … day" 15.18–15.9,
      "So PCA" 21.7–22.2, "two bros" 22.87, "sort your shit out" 24.96, render ends 25.6.
    -->
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: Montserrat, sans-serif;
        --glow: rgba(224, 48, 42, 0.9); --glow-soft: rgba(224, 48, 42, 0.4);
      }
      #plate-wrap, #fg-wrap { position: absolute; inset: 0; }
      #plate, #fg { width: 1920px; height: 1080px; object-fit: cover; }
      #plate-wrap { z-index: 0; }
      #fg-wrap { z-index: 20; }

      #dim {
        position: absolute; inset: 0; z-index: 1; pointer-events: none;
        background:
          radial-gradient(ellipse 46% 95% at 0% 50%, rgba(5, 8, 12, 0.9) 0%, rgba(5, 8, 12, 0.72) 55%, rgba(5, 8, 12, 0) 100%),
          radial-gradient(ellipse 40% 60% at 22% 100%, rgba(5, 8, 12, 0.5) 0%, rgba(5, 8, 12, 0) 100%);
      }
      #beam {
        position: absolute; left: 120px; width: 560px; top: 0; bottom: 0; z-index: 2; pointer-events: none;
        background: radial-gradient(ellipse 50% 92% at 50% 100%, var(--glow-soft) 0%, rgba(0, 0, 0, 0) 75%);
        mix-blend-mode: screen; transform-origin: 50% 100%;
      }
      #slit {
        position: absolute; left: 60px; width: 680px; bottom: 6px; height: 4px; z-index: 6; border-radius: 4px;
        background: linear-gradient(90deg, rgba(255,255,255,0), #ffffff 30%, #ffffff 70%, rgba(255,255,255,0));
        box-shadow: 0 0 18px 4px var(--glow), 0 0 60px 16px var(--glow-soft);
      }
      #ring {
        position: absolute; left: 140px; width: 520px; bottom: 0; height: 110px; z-index: 3; border-radius: 50%;
        border: 3px solid var(--glow); box-shadow: 0 0 24px var(--glow), inset 0 0 24px var(--glow-soft);
        transform: translateY(55px);
      }

      /* labels — top of the zone */
      #labels { position: absolute; left: 72px; top: 70px; width: 680px; height: 80px; z-index: 9; }
      .kicker {
        position: absolute; left: 0; top: 0; white-space: nowrap;
        font-weight: 600; font-size: 27px; letter-spacing: 0.3em; color: #f2f5f8;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.85), 0 0 18px var(--glow-soft);
      }
      .kicker b { font-weight: 800; }
      .kicker .r { color: #ff6a5e; }
      .kicker .bl { color: #8fb0ff; }
      #rule {
        position: absolute; left: 0; top: 46px; width: 460px; height: 2px; transform-origin: 0 50%;
        background: linear-gradient(90deg, var(--glow), rgba(255, 255, 255, 0));
      }

      /* posters — hero layout; transforms move them into the stacked / fanned states */
      .card { position: absolute; transform-origin: 0 0; border-radius: 16px; overflow: hidden; }
      .card img { width: 100%; height: 100%; display: block; }
      #c-tbjp { left: 110px; top: 210px; width: 600px; height: 597px; z-index: 7;
        box-shadow: 0 40px 90px rgba(0, 0, 0, 0.7), 0 0 0 2px rgba(255, 110, 100, 0.55), 0 0 60px rgba(224, 48, 42, 0.55); }
      #c-pca { left: 250px; top: 250px; width: 480px; height: 551px; z-index: 8;
        box-shadow: 0 40px 90px rgba(0, 0, 0, 0.7), 0 0 0 2px rgba(140, 170, 255, 0.6), 0 0 60px rgba(63, 108, 240, 0.6); }
      .shade { position: absolute; inset: 0; background: #000; opacity: 0; }
      .shine {
        position: absolute; inset: 0; mix-blend-mode: screen;
        background: linear-gradient(105deg, rgba(255,255,255,0) 35%, rgba(255,255,255,0.45) 48%, rgba(255,255,255,0) 60%);
        background-size: 300% 100%; background-position: 120% 0;
      }

      /* the clash stamp */
      #stamp { position: absolute; left: 70px; top: 610px; width: 680px; z-index: 10; text-align: center; transform: rotate(-7deg); }
      #stamp-main {
        display: inline-block; font-family: "Bebas Neue", sans-serif; font-size: 150px; line-height: 1; letter-spacing: 0.02em;
        color: #e0302a; -webkit-text-stroke: 3px #ffffff;
        text-shadow: 0 0 30px rgba(224, 48, 42, 0.8), 0 12px 40px rgba(0, 0, 0, 0.8);
        padding: 6px 26px 2px; border: 6px solid #ffffff; border-radius: 10px; background: rgba(10, 4, 4, 0.55);
      }
      #stamp-date {
        margin-top: 14px; font-weight: 800; font-size: 34px; letter-spacing: 0.32em; color: #ffffff;
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9);
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-r035" id="root" data-composition-id="main" data-start="0" data-duration="25.6" data-width="1920" data-height="1080">
      <div data-hf-id="hf-ifmw" id="plate-wrap">
        <video data-hf-id="hf-cz3x" id="plate" src="assets/plate.mp4" data-start="0" data-duration="25.6" data-track-index="0" muted playsinline></video>
      </div>
      <audio data-hf-id="hf-ilag" id="plate-audio" src="assets/plate.mp4" data-start="0" data-duration="25.6" data-track-index="1" data-volume="1"></audio>

      <div data-hf-id="hf-6c7x" id="dim" class="clip" data-start="0" data-duration="25.6" data-track-index="2"></div>
      <div data-hf-id="hf-lh1h" id="beam" class="clip" data-start="0" data-duration="25.6" data-track-index="3"></div>
      <div data-hf-id="hf-n1pl" id="ring" class="clip" data-start="0" data-duration="25.6" data-track-index="4"></div>

      <div data-hf-id="hf-sol0" id="c-tbjp" class="card clip" data-start="0" data-duration="25.6" data-track-index="5"><img data-hf-id="hf-6qoj" src="assets/tbjp.jpg" alt="" /><div data-hf-id="hf-q0n7" class="shade"></div><div data-hf-id="hf-j9ul" class="shine"></div></div>
      <div data-hf-id="hf-ensp" id="c-pca" class="card clip" data-start="0" data-duration="25.6" data-track-index="6"><img data-hf-id="hf-83zf" src="assets/pca.jpg" alt="" /><div data-hf-id="hf-iber" class="shade"></div><div data-hf-id="hf-aegh" class="shine"></div></div>

      <div data-hf-id="hf-f2pl" id="labels" class="clip" data-start="0" data-duration="25.6" data-track-index="7">
        <div data-hf-id="hf-vkid" class="kicker" id="k1">SHOW 01 · <b data-hf-id="hf-gkho" class="r">NPC 2 BROS</b> · BRADFORD</div>
        <div data-hf-id="hf-7itb" class="kicker" id="k2">SHOW 02 · <b data-hf-id="hf-2w26" class="bl">PCA BRITISH</b> · TELFORD</div>
        <div data-hf-id="hf-oiui" class="kicker" id="k3">SAME WEEKEND · <b data-hf-id="hf-09ad" class="r">2 BROS</b> + <b data-hf-id="hf-2qpt" class="bl">PCA</b></div>
        <div data-hf-id="hf-3c43" class="kicker" id="k4"><b data-hf-id="hf-4ixh" class="bl">PCA</b> · <b data-hf-id="hf-zom1" class="r">2 BROS</b> · SORT IT OUT</div>
        <div data-hf-id="hf-8e4z" id="rule"></div>
      </div>

      <div data-hf-id="hf-h0c8" id="stamp" class="clip" data-start="0" data-duration="25.6" data-track-index="8">
        <div data-hf-id="hf-yox8" id="stamp-main">SAME DAY</div>
        <div data-hf-id="hf-uh7p" id="stamp-date">SAT 17 OCT</div>
      </div>

      <div data-hf-id="hf-mzvc" id="slit" class="clip" data-start="0" data-duration="25.6" data-track-index="9"></div>

      <div data-hf-id="hf-1yip" id="fg-wrap">
        <video data-hf-id="hf-zlbu" id="fg" src="assets/fg.webm" data-start="0" data-duration="25.6" data-track-index="10" muted playsinline></video>
      </div>
    </div>

    <script>
      (() => {
        const tl = gsap.timeline({ paused: true });
        const f = (s) => Math.round(s * 30) / 30; // snap to frame boundaries
        const RED = { "--glow": "rgba(224,48,42,0.9)", "--glow-soft": "rgba(224,48,42,0.4)" };
        const BLUE = { "--glow": "rgba(63,108,240,0.95)", "--glow-soft": "rgba(63,108,240,0.42)" };
        const BOTH = { "--glow": "rgba(186,70,190,0.95)", "--glow-soft": "rgba(150,70,200,0.42)" };
        // fanned layout (both posters side by side), as transforms from each card's hero box (origin top-left)
        const FAN_TBJP = { x: -70, y: 40, scale: 0.567, rotation: -6 };
        const FAN_PCA = { x: 145, y: -20, scale: 0.6875, rotation: 5 };

        // ---- start state: only the footage
        gsap.set(["#dim", "#beam", "#slit", "#ring", ".kicker", "#rule", "#stamp"], { opacity: 0 });
        gsap.set(["#c-tbjp", "#c-pca"], { y: 900 });

        // stage on / off helpers (same move as the Formula 75 piece)
        const stageOn = (t) => {
          tl.to("#dim", { opacity: 1, duration: f(0.5), ease: "power2.out" }, f(t));
          tl.fromTo("#slit", { opacity: 0, scaleX: 0.1 }, { opacity: 1, scaleX: 1, duration: f(0.33), ease: "expo.out", immediateRender: false }, f(t + 0.07));
          tl.fromTo("#beam", { opacity: 0, scaleY: 0.2 }, { opacity: 1, scaleY: 1, duration: f(0.7), ease: "power3.out", immediateRender: false }, f(t + 0.13));
        };
        const stageOff = (t) => {
          tl.to(["#slit", "#beam"], { opacity: 0, duration: f(0.33), ease: "power1.in" }, f(t + 0.17));
          tl.to("#dim", { opacity: 0, duration: f(0.47), ease: "power1.inOut" }, f(t + 0.1));
        };
        const ringBurst = (t) => tl.fromTo("#ring", { opacity: 0.95, scale: 0.35 }, { opacity: 0, scale: 1.5, duration: f(0.8), ease: "power2.out", immediateRender: false }, f(t));
        const shine = (sel, t) => tl.fromTo(sel, { backgroundPosition: "120% 0" }, { backgroundPosition: "-60% 0", duration: f(0.9), ease: "power2.inOut", immediateRender: false }, f(t));
        const kickIn = (sel, t) => tl.fromTo(sel, { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: f(0.4), ease: "expo.out", immediateRender: false }, f(t));
        const kickOut = (sel, t) => tl.to(sel, { opacity: 0, y: -14, duration: f(0.23), ease: "power2.in" }, f(t));
        const shake = (sel, t) => tl.to(sel, { keyframes: [{ x: "-=14", duration: 0.033 }, { x: "+=24", duration: 0.033 }, { x: "-=16", duration: 0.033 }, { x: "+=6", duration: 0.067 }] }, f(t));

        // ---- BEAT 1 — "NPC, two bros … Bradford" (1.16): red stage, TBJP poster rises out of the floor
        stageOn(0.9);
        tl.fromTo("#c-tbjp", { y: 900, rotation: -6, scale: 0.94 }, { y: 0, rotation: 0, scale: 1, duration: f(0.9), ease: "back.out(1.15)", immediateRender: false }, f(1.0));
        tl.fromTo("#c-tbjp", { filter: "blur(16px)" }, { filter: "blur(0px)", duration: f(0.5), ease: "power2.out", immediateRender: false }, f(1.0));
        ringBurst(1.13);
        kickIn("#k1", 1.4);
        tl.fromTo("#rule", { opacity: 1, scaleX: 0 }, { scaleX: 1, duration: f(0.5), ease: "power2.inOut", immediateRender: false }, f(1.6));
        shine("#c-tbjp .shine", 2.2);
        tl.to("#c-tbjp", { y: -10, duration: f(1.6), ease: "sine.inOut", yoyo: true, repeat: 2 }, f(2.0));

        // ---- BEAT 2 — "PCA … Telford" (6.87): TBJP steps back + dims, light recolours blue, PCA rises in front
        tl.to("#c-tbjp .shade", { opacity: 0.45, duration: f(0.6), ease: "power2.inOut" }, f(6.6));
        tl.to("#c-tbjp", { x: -70, y: -20, scale: 0.8, rotation: -5, duration: f(0.6), ease: "power3.inOut" }, f(6.6));
        tl.to("#root", { ...BLUE, duration: f(0.5), ease: "power2.inOut" }, f(6.7));
        tl.fromTo("#c-pca", { y: 900, rotation: 7, scale: 0.94 }, { y: 0, rotation: 0, scale: 1, duration: f(0.9), ease: "back.out(1.15)", immediateRender: false }, f(6.7));
        tl.fromTo("#c-pca", { filter: "blur(16px)" }, { filter: "blur(0px)", duration: f(0.5), ease: "power2.out", immediateRender: false }, f(6.7));
        ringBurst(6.83);
        kickOut("#k1", 6.6);
        kickIn("#k2", 6.93);
        shine("#c-pca .shine", 7.8);
        tl.to("#c-pca", { y: -10, duration: f(1.6), ease: "sine.inOut", yoyo: true, repeat: 3 }, f(7.7));

        // ---- BEAT 3 — "same weekend … same day" (14.32 / 15.18): both fan out side by side, SAME DAY stamp slams
        tl.to("#c-tbjp", { ...FAN_TBJP, duration: f(0.6), ease: "power3.inOut" }, f(14.1));
        tl.to("#c-tbjp .shade", { opacity: 0, duration: f(0.6), ease: "power2.inOut" }, f(14.1));
        tl.to("#c-pca", { ...FAN_PCA, duration: f(0.6), ease: "power3.inOut" }, f(14.1));
        tl.to("#root", { ...BOTH, duration: f(0.5), ease: "power2.inOut" }, f(14.1));
        kickOut("#k2", 14.0);
        kickIn("#k3", 14.27);
        tl.fromTo("#stamp", { opacity: 0, scale: 2.2 }, { opacity: 1, scale: 1, duration: f(0.2), ease: "power4.in", immediateRender: false }, f(15.1));
        shake(["#c-tbjp", "#c-pca"], 15.3);
        ringBurst(15.3);
        tl.fromTo("#stamp-date", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: f(0.3), ease: "power2.out", immediateRender: false }, f(15.5));
        // OUT — everything sinks back into the floor after "day?"
        tl.to("#stamp", { opacity: 0, scale: 0.9, duration: f(0.27), ease: "power2.in" }, f(16.6));
        tl.to("#c-tbjp", { y: "+=900", filter: "blur(14px)", duration: f(0.47), ease: "power2.in" }, f(16.63));
        tl.to("#c-pca", { y: "+=900", filter: "blur(14px)", duration: f(0.47), ease: "power2.in" }, f(16.7));
        tl.to(["#k3", "#rule"], { opacity: 0, y: 24, duration: f(0.33), ease: "power2.in" }, f(16.6));
        stageOff(16.9);

        // ---- BEAT 4 — callback "So PCA … two bros … sort your shit out" (22.18 / 22.87 / 24.96)
        tl.set("#root", { ...BLUE }, f(21.8));
        tl.set("#c-pca", { ...FAN_PCA, y: FAN_PCA.y + 900, filter: "blur(14px)" }, f(21.8));
        tl.set("#c-tbjp", { ...FAN_TBJP, y: FAN_TBJP.y + 900, filter: "blur(14px)" }, f(21.8));
        tl.set(["#rule", "#k4"], { y: 0 }, f(21.8));
        stageOn(21.9);
        tl.to("#c-pca", { y: FAN_PCA.y, duration: f(0.6), ease: "back.out(1.3)" }, f(22.1));
        tl.to("#c-pca", { filter: "blur(0px)", duration: f(0.4), ease: "power2.out" }, f(22.1));
        tl.to("#root", { ...BOTH, duration: f(0.4), ease: "power2.inOut" }, f(22.8));
        tl.to("#c-tbjp", { y: FAN_TBJP.y, duration: f(0.6), ease: "back.out(1.3)" }, f(22.8));
        tl.to("#c-tbjp", { filter: "blur(0px)", duration: f(0.4), ease: "power2.out" }, f(22.8));
        kickIn("#k4", 22.3);
        tl.fromTo("#rule", { opacity: 1, scaleX: 0 }, { scaleX: 1, duration: f(0.4), ease: "power2.inOut", immediateRender: false }, f(22.5));
        shake(["#c-tbjp", "#c-pca"], 24.93);
        // OUT — gone before the render ends at 25.6
        tl.to("#c-tbjp", { y: "+=900", filter: "blur(14px)", duration: f(0.4), ease: "power2.in" }, f(25.07));
        tl.to("#c-pca", { y: "+=900", filter: "blur(14px)", duration: f(0.4), ease: "power2.in" }, f(25.1));
        tl.to(["#k4", "#rule"], { opacity: 0, y: 24, duration: f(0.3), ease: "power2.in" }, f(25.03));
        tl.to(["#slit", "#beam"], { opacity: 0, duration: f(0.27), ease: "power1.in" }, f(25.2));
        tl.to("#dim", { opacity: 0, duration: f(0.37), ease: "power1.inOut" }, f(25.13));

        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
