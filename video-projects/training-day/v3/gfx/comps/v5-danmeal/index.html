<!doctype html><html lang="en"><head><meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" /><script src="assets/gsap.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1920px; height:1080px; overflow:hidden; background:transparent; }
#root { position:relative; width:1920px; height:1080px; overflow:hidden; font-family:Montserrat, sans-serif; color:#f6f6f6; }
.shadow { text-shadow:0 4px 24px rgba(0,0,0,0.75), 0 2px 4px rgba(0,0,0,0.6); }
/* exercise title: index numeral + name + rep chip, no box */
.ex { position:absolute; left:52px; bottom:72px; padding:22px 160px 24px 32px; border-radius:12px; box-shadow:0 0 40px 10px rgba(0,0,0,0.25);
  background:linear-gradient(90deg, rgba(0,0,0,0.78) 0%, rgba(0,0,0,0.66) 65%, rgba(0,0,0,0) 100%); }
.ex .idx { font-family:"Bebas Neue", sans-serif; font-size:40px; letter-spacing:0.12em; color:#ff3b30; }
.ex .idx span { color:rgba(255,255,255,0.7); }
.ex .rule { width:120px; height:3px; background:#ff3b30; margin:8px 0 12px; transform-origin:0 50%; }
.ex .nm { font-family:"Bebas Neue", sans-serif; font-size:104px; line-height:0.88; letter-spacing:0.01em; white-space:nowrap; }
.ex .nmw { overflow:hidden; padding-bottom:6px; }
.ex .chip { display:inline-block; margin-top:16px; padding:8px 16px 7px; border:2px solid rgba(255,255,255,0.85); border-radius:4px;
  font-weight:800; font-size:28px; letter-spacing:0.24em; background:rgba(0,0,0,0.45); }
.ex .chip b { color:#ff3b30; font-weight:800; }

#mc { position:absolute; left:70px; top:110px; width:640px; padding:30px 40px 34px; border-radius:16px; border-left:6px solid #ff3b30;
  background:linear-gradient(160deg, rgba(14,14,16,0.92) 0%, rgba(8,8,10,0.86) 100%); box-shadow:0 30px 80px rgba(0,0,0,0.6); }
#mc .top { display:flex; justify-content:space-between; align-items:center; }
#mc .k { font-weight:800; font-size:18px; letter-spacing:0.4em; color:#ff3b30; }
#mc .top img { width:120px; }
#mc .h { font-family:"Bebas Neue"; font-size:110px; line-height:0.86; margin-top:6px; }
#mc .rule { width:110px; height:3px; background:#ff3b30; margin:12px 0 18px; transform-origin:0 50%; }
#mc .sec { font-weight:800; font-size:16px; letter-spacing:0.32em; color:#9aa3ab; margin:4px 0 8px; }
#mc .it { display:flex; align-items:baseline; gap:18px; padding:9px 0; border-bottom:1px solid rgba(255,255,255,0.12); }
#mc .it .q { font-family:"Bebas Neue"; font-size:42px; color:#ff3b30; width:110px; flex:none; line-height:1; }
#mc .it .n { font-weight:700; font-size:30px; }
#mc .gap { height:20px; }

</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="8.5" data-width="1920" data-height="1080"><div id="mc" class="shadow"><div class="top"><div class="k">DANIELA · SHOW DAY</div><img src="assets/apexx-logo.png"/></div><div class="h">MEAL 1</div><div class="rule"></div><div class="sec">FOOD</div><div class="it" id="r0"><div class="q">1×</div><div class="n">Bagel</div></div><div class="it" id="r1"><div class="q">50g</div><div class="n">Chicken</div></div><div class="it" id="r2"><div class="q">1×</div><div class="n">Square bar</div></div><div class="it" id="r3"><div class="q">20g</div><div class="n">Peanut butter</div></div><div class="gap"></div><div class="sec">WITH IT</div><div class="it" id="r4"><div class="q">500ml</div><div class="n">Water</div></div><div class="it" id="r5"><div class="q">1×</div><div class="n">Dandelion / Vit C</div></div><div class="it" id="r6"><div class="q">1×</div><div class="n">Double espresso if needed</div></div><div class="it" id="r7"><div class="q">—</div><div class="n">Salt as usual</div></div></div></div>
<script>(() => { const tl = gsap.timeline({ paused:true }); const f = (s) => Math.round(s*30)/30;
gsap.set(["#mc","#r0","#r1","#r2","#r3","#r4","#r5","#r6","#r7"], { opacity:0 });
tl.fromTo("#mc", { opacity:0, x:-60 }, { opacity:1, x:0, duration:f(0.45), ease:"expo.out", immediateRender:false }, f(0.05));
tl.fromTo("#mc .h", { yPercent:60, opacity:0 }, { yPercent:0, opacity:1, duration:f(0.45), ease:"expo.out", immediateRender:false }, f(0.2));
tl.fromTo("#mc .rule", { scaleX:0 }, { scaleX:1, duration:f(0.35), ease:"power3.inOut", immediateRender:false }, f(0.35));
tl.fromTo("#r0", { opacity:0, x:-24 }, { opacity:1, x:0, duration:f(0.3), ease:"power3.out", immediateRender:false }, f(0.55));
tl.fromTo("#r1", { opacity:0, x:-24 }, { opacity:1, x:0, duration:f(0.3), ease:"power3.out", immediateRender:false }, f(0.67));
tl.fromTo("#r2", { opacity:0, x:-24 }, { opacity:1, x:0, duration:f(0.3), ease:"power3.out", immediateRender:false }, f(0.79));
tl.fromTo("#r3", { opacity:0, x:-24 }, { opacity:1, x:0, duration:f(0.3), ease:"power3.out", immediateRender:false }, f(0.91));
tl.fromTo("#r4", { opacity:0, x:-24 }, { opacity:1, x:0, duration:f(0.3), ease:"power3.out", immediateRender:false }, f(1.03));
tl.fromTo("#r5", { opacity:0, x:-24 }, { opacity:1, x:0, duration:f(0.3), ease:"power3.out", immediateRender:false }, f(1.15));
tl.fromTo("#r6", { opacity:0, x:-24 }, { opacity:1, x:0, duration:f(0.3), ease:"power3.out", immediateRender:false }, f(1.27));
tl.fromTo("#r7", { opacity:0, x:-24 }, { opacity:1, x:0, duration:f(0.3), ease:"power3.out", immediateRender:false }, f(1.39));
tl.to("#mc", { opacity:0, x:-30, duration:f(0.35), ease:"power2.in" }, f(8.5 - 0.45));
tl.to({}, { duration:8.5 }, 0); window.__timelines = window.__timelines || {}; window.__timelines["main"] = tl; })();</script>
</body></html>
