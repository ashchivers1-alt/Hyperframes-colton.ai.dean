<!doctype html><html lang="en"><head><meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" /><script src="assets/gsap.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1920px; height:1080px; overflow:hidden; background:transparent; }
#root { position:relative; width:1920px; height:1080px; overflow:hidden; font-family:Montserrat, sans-serif; color:#f6f6f6; }
.shadow { text-shadow:0 4px 24px rgba(0,0,0,0.75), 0 2px 4px rgba(0,0,0,0.6); }
/* exercise title: index numeral + name + rep chip, no box */
.ex { position:absolute; left:52px; bottom:72px; padding:22px 160px 24px 32px; border-radius:12px; box-shadow:0 0 40px 10px rgba(0,0,0,0.25);
  background:linear-gradient(90deg, rgba(0,0,0,0.78) 0%, rgba(0,0,0,0.66) 65%, rgba(0,0,0,0) 100%); }
.ex .idx { font-family:"Bebas Neue", sans-serif; font-size:40px; letter-spacing:0.12em; color:#ff3b30; }
.ex .idx span { color:rgba(255,255,255,0.7); }
.ex .rule { width:120px; height:3px; background:#ff3b30; margin:8px 0 12px; transform-origin:0 50%; }
.ex .nm { font-family:"Bebas Neue", sans-serif; font-size:104px; line-height:0.88; letter-spacing:0.01em; white-space:nowrap; }
.ex .nmw { overflow:hidden; padding-bottom:6px; }
.ex .chip { display:inline-block; margin-top:16px; padding:8px 16px 7px; border:2px solid rgba(255,255,255,0.85); border-radius:4px;
  font-weight:800; font-size:28px; letter-spacing:0.24em; background:rgba(0,0,0,0.45); }
.ex .chip b { color:#ff3b30; font-weight:800; }

#cd { position:absolute; left:52px; bottom:64px; padding:26px 150px 28px 36px; border-radius:14px; border-left:6px solid #ff3b30;
  background:linear-gradient(90deg, rgba(0,0,0,0.84) 0%, rgba(0,0,0,0.72) 66%, rgba(0,0,0,0) 100%); box-shadow:0 0 40px 10px rgba(0,0,0,0.25); }
#cd .top { display:flex; align-items:center; gap:20px; }
#cd .top img { height:58px; display:block; }
#cd .top .bar { width:2px; height:44px; background:rgba(255,255,255,0.45); }
#cd .lbl { font-weight:800; font-size:21px; letter-spacing:0.38em; color:#ff3b30; }
#cd .code { font-family:"Bebas Neue", sans-serif; font-size:132px; line-height:0.88; margin-top:12px; letter-spacing:0.02em; }
#cd .code span { color:#ff3b30; }
#cd .web { display:flex; align-items:center; gap:14px; margin-top:12px; }
#cd .web small { font-family:Montserrat; font-weight:700; font-size:19px; letter-spacing:0.22em; color:#cfcfcf; }
#cd .web b { font-family:"Bebas Neue", sans-serif; font-weight:400; font-size:56px; line-height:1; letter-spacing:0.05em; padding:4px 14px 0; border:2px solid rgba(255,255,255,0.85); border-radius:6px; }

</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="12.0" data-width="1920" data-height="1080"><div id="cd" class="shadow"><div class="top"><img src="assets/tbjp-logo.png"/><div class="bar"></div><div class="lbl">DISCOUNT CODE</div></div><div class="code">ASH<span>10</span></div><div class="web"><small>SHOP AT</small><b>TB-JP.COM</b></div></div></div>
<script>(() => { const tl = gsap.timeline({ paused:true }); const f = (s) => Math.round(s*30)/30;
gsap.set(["#cd","#cd .top img","#cd .web"], { opacity:0 });
tl.fromTo("#cd", { opacity:0, x:-50 }, { opacity:1, x:0, duration:f(0.45), ease:"expo.out", immediateRender:false }, f(0.15));
tl.fromTo("#cd .top img", { opacity:0, scale:0.7, transformOrigin:"0% 50%" }, { opacity:1, scale:1, duration:f(0.4), ease:"back.out(2)", immediateRender:false }, f(0.3));
tl.fromTo("#cd .code", { scale:1.3, transformOrigin:"0% 50%" }, { scale:1, duration:f(0.4), ease:"back.out(2)", immediateRender:false }, f(0.35));
tl.fromTo("#cd .web", { opacity:0, y:14 }, { opacity:1, y:0, duration:f(0.4), ease:"power3.out", immediateRender:false }, f(0.85));
tl.to("#cd", { opacity:0, x:-30, duration:f(0.3), ease:"power2.in" }, f(11.6));
tl.to({}, { duration:12.0 }, 0); window.__timelines = window.__timelines || {}; window.__timelines["main"] = tl; })();</script>
</body></html>
