<!doctype html><html lang="en"><head><meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" /><script src="assets/gsap.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1920px; height:1080px; overflow:hidden; background:transparent; }
#root { position:relative; width:1920px; height:1080px; overflow:hidden; font-family:Montserrat, sans-serif; color:#f6f6f6; }
.shadow { text-shadow:0 4px 24px rgba(0,0,0,0.75), 0 2px 4px rgba(0,0,0,0.6); }
/* exercise title: index numeral + name + rep chip, no box */
.ex { position:absolute; left:52px; bottom:72px; padding:22px 160px 24px 32px; border-radius:12px; box-shadow:0 0 40px 10px rgba(0,0,0,0.25);
  background:linear-gradient(90deg, rgba(0,0,0,0.78) 0%, rgba(0,0,0,0.66) 65%, rgba(0,0,0,0) 100%); }
.ex .idx { font-family:"Bebas Neue", sans-serif; font-size:40px; letter-spacing:0.12em; color:#ff3b30; }
.ex .idx span { color:rgba(255,255,255,0.7); }
.ex .rule { width:120px; height:3px; background:#ff3b30; margin:8px 0 12px; transform-origin:0 50%; }
.ex .nm { font-family:"Bebas Neue", sans-serif; font-size:104px; line-height:0.88; letter-spacing:0.01em; white-space:nowrap; }
.ex .nmw { overflow:hidden; padding-bottom:6px; }
.ex .chip { display:inline-block; margin-top:16px; padding:8px 16px 7px; border:2px solid rgba(255,255,255,0.85); border-radius:4px;
  font-weight:800; font-size:28px; letter-spacing:0.24em; background:rgba(0,0,0,0.45); }
.ex .chip b { color:#ff3b30; font-weight:800; }

#tp { position:absolute; left:52px; top:44px; width:680px; padding:24px 110px 28px 32px; border-radius:12px;
  background:linear-gradient(90deg, rgba(0,0,0,0.80) 0%, rgba(0,0,0,0.68) 72%, rgba(0,0,0,0) 100%); }
#tp .lbl { font-weight:800; font-size:20px; letter-spacing:0.4em; color:#ff3b30; }
#tp .h { font-family:"Bebas Neue", sans-serif; font-size:82px; line-height:0.9; margin-top:6px; }
#tp .st { display:flex; gap:16px; align-items:baseline; margin-top:14px; font-weight:700; font-size:30px; line-height:1.2; }
#tp .st .n { font-family:"Bebas Neue"; font-size:48px; color:#ff3b30; flex:none; width:26px; }
#tp .st u { text-decoration:none; background:linear-gradient(transparent 62%, rgba(255,59,48,0.75) 62%); }

</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="22.0" data-width="1920" data-height="1080"><div id="tp" class="shadow"><div class="lbl">TOP TIP</div><div class="h">MICROWAVE RICE</div>
<div class="st" id="s1"><div class="n">1</div><div>Microwave the pouch as normal</div></div>
<div class="st" id="s2"><div class="n">2</div><div>Open it, add a <u>splash of water</u> &amp; stir</div></div>
<div class="st" id="s3"><div class="n">3</div><div>Let it sit <u>~1 minute</u>, far more moist</div></div></div></div>
<script>(() => { const tl = gsap.timeline({ paused:true }); const f = (s) => Math.round(s*30)/30;
gsap.set(["#tp","#s1","#s2","#s3"], { opacity:0 });
tl.fromTo("#tp", { opacity:0, x:-50 }, { opacity:1, x:0, duration:f(0.45), ease:"expo.out", immediateRender:false }, f(1.6));
tl.fromTo("#s1", { opacity:0, y:14 }, { opacity:1, y:0, duration:f(0.35), ease:"power2.out", immediateRender:false }, f(5.8));
tl.fromTo("#s2", { opacity:0, y:14 }, { opacity:1, y:0, duration:f(0.35), ease:"back.out(1.6)", immediateRender:false }, f(8.6));
tl.fromTo("#s3", { opacity:0, y:14 }, { opacity:1, y:0, duration:f(0.35), ease:"power3.out", immediateRender:false }, f(15.2));
tl.to("#tp", { opacity:0, x:-30, duration:f(0.3), ease:"power2.in" }, f(21.6));
tl.to({}, { duration:22.0 }, 0); window.__timelines = window.__timelines || {}; window.__timelines["main"] = tl; })();</script>
</body></html>
