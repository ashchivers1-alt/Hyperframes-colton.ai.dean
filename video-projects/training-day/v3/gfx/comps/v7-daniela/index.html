<!doctype html><html lang="en"><head><meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" /><script src="assets/gsap.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1920px; height:1080px; overflow:hidden; background:transparent; }
#root { position:relative; width:1920px; height:1080px; overflow:hidden; font-family:Montserrat, sans-serif; color:#f6f6f6; }
.shadow { text-shadow:0 4px 24px rgba(0,0,0,0.75), 0 2px 4px rgba(0,0,0,0.6); }
/* exercise title: index numeral + name + rep chip, no box */
.ex { position:absolute; left:52px; bottom:72px; padding:22px 160px 24px 32px; border-radius:12px; box-shadow:0 0 40px 10px rgba(0,0,0,0.25);
  background:linear-gradient(90deg, rgba(0,0,0,0.78) 0%, rgba(0,0,0,0.66) 65%, rgba(0,0,0,0) 100%); }
.ex .idx { font-family:"Bebas Neue", sans-serif; font-size:40px; letter-spacing:0.12em; color:#ff3b30; }
.ex .idx span { color:rgba(255,255,255,0.7); }
.ex .rule { width:120px; height:3px; background:#ff3b30; margin:8px 0 12px; transform-origin:0 50%; }
.ex .nm { font-family:"Bebas Neue", sans-serif; font-size:104px; line-height:0.88; letter-spacing:0.01em; white-space:nowrap; }
.ex .nmw { overflow:hidden; padding-bottom:6px; }
.ex .chip { display:inline-block; margin-top:16px; padding:8px 16px 7px; border:2px solid rgba(255,255,255,0.85); border-radius:4px;
  font-weight:800; font-size:28px; letter-spacing:0.24em; background:rgba(0,0,0,0.45); }
.ex .chip b { color:#ff3b30; font-weight:800; }

#ph { position:absolute; right:90px; top:90px; width:470px; height:627px; padding:12px; background:#f4f4f4; border-radius:6px;
  box-shadow:0 30px 80px rgba(0,0,0,0.55); transform:rotate(2.5deg); }
#ph .im { position:absolute; inset:12px 12px 12px 12px; overflow:hidden; border-radius:3px; background:#111; }
#ph .im img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
#ph .tape { position:absolute; left:50%; top:-16px; width:130px; height:34px; margin-left:-65px; background:rgba(255,59,48,0.85); transform:rotate(-3deg); }
#ph .logo { position:absolute; right:-36px; bottom:-30px; width:150px; filter:drop-shadow(0 6px 14px rgba(0,0,0,0.6)); transform:rotate(-6deg); }
.ex .badge { display:inline-flex; align-items:center; gap:12px; margin-top:14px; padding:8px 18px 7px; border-radius:4px; font-weight:800; font-size:28px;
  letter-spacing:0.18em; background:#ff3b30; }
.ex .badge.gold { background:linear-gradient(135deg, #f7d774, #c99a2e); color:#1b1400; }
.ex .badge .big { font-family:"Bebas Neue"; font-size:46px; letter-spacing:0.04em; line-height:0.9; }
.ex .sub { font-weight:700; font-size:22px; letter-spacing:0.2em; margin-top:12px; color:#e6e6e6; white-space:nowrap; }

</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="19.5" data-width="1920" data-height="1080"><div id="ph"><div class="im"><img id="i0" src="assets/d1.jpg"/><img id="i1" src="assets/d2.jpg"/></div><div class="tape"></div><img class="logo" src="assets/apexx-logo.png"/></div><div class="ex shadow"><div class="idx">WEEKEND RESULTS · 04</div><div class="rule"></div><div class="nmw"><div class="nm">DANIELA</div></div><div class="sub">WELLNESS · NPC KENTUCKY · USA</div><div class="badge gold"><span class="big">🏆</span>BOTH CLASSES + OVERALL</div><div class="sub" style="font-size:19px;color:#bdbdbd">NPC KENTUCKY BOURBON & KENTUCKY STATE</div></div></div>
<script>(() => { const tl = gsap.timeline({ paused:true }); const f = (s) => Math.round(s*30)/30;

tl.fromTo("#ph", { opacity:0, y:60, rotation:8 }, { opacity:1, y:0, rotation:2.5, duration:f(0.6), ease:"back.out(1.3)", immediateRender:false }, f(0.2));
tl.fromTo("#ph .im img", { scale:1.0 }, { scale:1.07, duration:f(19.5), ease:"none", immediateRender:false }, 0);
tl.fromTo(".ex", { opacity:0, x:-50 }, { opacity:1, x:0, duration:f(0.45), ease:"expo.out", immediateRender:false }, f(0.5));

tl.fromTo(".ex .sub", { opacity:0, y:10 }, { opacity:1, y:0, duration:f(0.35), ease:"power3.out", stagger:0.6, immediateRender:false }, f(1.0));
tl.fromTo(".ex .badge", { opacity:0, scale:0.6 }, { opacity:1, scale:1, duration:f(0.45), ease:"back.out(2)", immediateRender:false }, f(1.3));
gsap.set("#i1", { opacity:0 });
tl.to("#i1", { opacity:1, duration:f(0.6) }, f(9.75));
tl.to("#ph", { opacity:0, y:-40, rotation:-4, duration:f(0.4), ease:"power2.in" }, f(19.5 - 0.5));
tl.to(".ex", { opacity:0, x:-30, duration:f(0.35), ease:"power2.in" }, f(19.5 - 0.5));
tl.to({}, { duration:19.5 }, 0); window.__timelines = window.__timelines || {}; window.__timelines["main"] = tl; })();</script>
</body></html>
