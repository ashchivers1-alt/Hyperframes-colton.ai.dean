<!doctype html><html lang="en"><head><meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" /><script src="assets/gsap.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1920px; height:1080px; overflow:hidden; background:transparent; }
#root { position:relative; width:1920px; height:1080px; overflow:hidden; font-family:Montserrat, sans-serif; color:#f6f6f6; }
.shadow { text-shadow:0 4px 24px rgba(0,0,0,0.75), 0 2px 4px rgba(0,0,0,0.6); }
/* exercise title: index numeral + name + rep chip, no box */
.ex { position:absolute; left:52px; bottom:72px; padding:22px 160px 24px 32px; border-radius:12px; box-shadow:0 0 40px 10px rgba(0,0,0,0.25);
  background:linear-gradient(90deg, rgba(0,0,0,0.78) 0%, rgba(0,0,0,0.66) 65%, rgba(0,0,0,0) 100%); }
.ex .idx { font-family:"Bebas Neue", sans-serif; font-size:40px; letter-spacing:0.12em; color:#ff3b30; }
.ex .idx span { color:rgba(255,255,255,0.7); }
.ex .rule { width:120px; height:3px; background:#ff3b30; margin:8px 0 12px; transform-origin:0 50%; }
.ex .nm { font-family:"Bebas Neue", sans-serif; font-size:104px; line-height:0.88; letter-spacing:0.01em; white-space:nowrap; }
.ex .nmw { overflow:hidden; padding-bottom:6px; }
.ex .chip { display:inline-block; margin-top:16px; padding:8px 16px 7px; border:2px solid rgba(255,255,255,0.85); border-radius:4px;
  font-weight:800; font-size:28px; letter-spacing:0.24em; background:rgba(0,0,0,0.45); }
.ex .chip b { color:#ff3b30; font-weight:800; }

#pc { position:absolute; left:70px; top:90px; width:680px; height:680px; border-radius:14px; overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,0.6); }
#pc img.ph { width:100%; height:100%; display:block; object-fit:cover; }
#pc .half { position:absolute; top:0; bottom:0; width:50%; background:#0b0b0b; }
#pc .hl { left:0; transform-origin:0 50%; } #pc .hr { right:0; transform-origin:100% 50%; }
#pc .div { position:absolute; left:50%; top:0; bottom:0; width:6px; margin-left:-3px; background:#ff3b30; transform-origin:50% 0; box-shadow:0 0 18px rgba(255,59,48,0.8); }
#pc #tag { position:absolute; right:12px; top:12px; width:150px; filter:drop-shadow(0 4px 10px rgba(0,0,0,0.6)); }
#np { position:absolute; left:52px; top:740px; padding:20px 120px 22px 30px; border-radius:12px;
  background:linear-gradient(90deg, rgba(0,0,0,0.86) 0%, rgba(0,0,0,0.74) 70%, rgba(0,0,0,0) 100%); }
#np .k { font-weight:800; font-size:18px; letter-spacing:0.4em; color:#ff3b30; }
#np .nmw { overflow:hidden; padding-bottom:4px; }
#np .nm { font-family:"Bebas Neue"; font-size:96px; line-height:0.88; margin-top:4px; }

</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="7.2" data-width="1920" data-height="1080"><div id="pc"><img class="ph" src="assets/gab-progress.jpg"/><div class="half hl"></div><div class="half hr"></div><div class="div"></div><img id="tag" src="assets/apexx-logo.png"/></div><div id="np" class="shadow"><div class="k">GABRIELLA · PROGRESS</div><div class="nmw"><div class="nm">REAR SHOT</div></div></div></div>
<script>(() => { const tl = gsap.timeline({ paused:true }); const f = (s) => Math.round(s*30)/30;
gsap.set(["#pc","#np","#tag"], { opacity:0 });
tl.fromTo("#pc", { opacity:0, scale:0.94, y:30 }, { opacity:1, scale:1, y:0, duration:f(0.45), ease:"expo.out", immediateRender:false }, f(0.05));
tl.fromTo(".div", { scaleY:0 }, { scaleY:1, duration:f(0.45), ease:"power3.out", immediateRender:false }, f(0.2));
tl.fromTo(".hl", { scaleX:1 }, { scaleX:0, duration:f(0.55), ease:"power3.inOut", immediateRender:false }, f(0.45));
tl.fromTo(".hr", { scaleX:1 }, { scaleX:0, duration:f(0.55), ease:"power3.inOut", immediateRender:false }, f(0.85));
tl.fromTo("#pc .ph", { scale:1.0 }, { scale:1.05, duration:f(7.2), ease:"none", immediateRender:false }, 0);
tl.fromTo("#tag", { opacity:0, scale:0.6, rotation:-8 }, { opacity:1, scale:1, rotation:0, duration:f(0.4), ease:"back.out(2)", immediateRender:false }, f(1.1));
tl.fromTo("#np", { opacity:0, x:-50 }, { opacity:1, x:0, duration:f(0.45), ease:"expo.out", immediateRender:false }, f(0.4));
tl.fromTo("#np .nm", { yPercent:110 }, { yPercent:0, duration:f(0.5), ease:"expo.out", immediateRender:false }, f(0.55));
tl.to("#pc", { opacity:0, y:-30, duration:f(0.4), ease:"power2.in" }, f(7.2 - 0.5));
tl.to("#np", { opacity:0, x:-30, duration:f(0.35), ease:"power2.in" }, f(7.2 - 0.5));
tl.to({}, { duration:7.2 }, 0); window.__timelines = window.__timelines || {}; window.__timelines["main"] = tl; })();</script>
</body></html>
