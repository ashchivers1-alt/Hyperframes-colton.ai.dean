<!doctype html><html lang="en"><head><meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" /><script src="assets/gsap.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1920px; height:1080px; overflow:hidden; background:transparent; }
#root { position:relative; width:1920px; height:1080px; overflow:hidden; font-family:Montserrat, sans-serif; color:#f6f6f6; }
.shadow { text-shadow:0 4px 24px rgba(0,0,0,0.75), 0 2px 4px rgba(0,0,0,0.6); }
/* exercise title: index numeral + name + rep chip, no box */
.ex { position:absolute; left:52px; bottom:72px; padding:22px 160px 24px 32px; border-radius:12px; box-shadow:0 0 40px 10px rgba(0,0,0,0.25);
  background:linear-gradient(90deg, rgba(0,0,0,0.78) 0%, rgba(0,0,0,0.66) 65%, rgba(0,0,0,0) 100%); }
.ex .idx { font-family:"Bebas Neue", sans-serif; font-size:40px; letter-spacing:0.12em; color:#ff3b30; }
.ex .idx span { color:rgba(255,255,255,0.7); }
.ex .rule { width:120px; height:3px; background:#ff3b30; margin:8px 0 12px; transform-origin:0 50%; }
.ex .nm { font-family:"Bebas Neue", sans-serif; font-size:104px; line-height:0.88; letter-spacing:0.01em; white-space:nowrap; }
.ex .nmw { overflow:hidden; padding-bottom:6px; }
.ex .chip { display:inline-block; margin-top:16px; padding:8px 16px 7px; border:2px solid rgba(255,255,255,0.85); border-radius:4px;
  font-weight:800; font-size:28px; letter-spacing:0.24em; background:rgba(0,0,0,0.45); }
.ex .chip b { color:#ff3b30; font-weight:800; }

#pn { position:absolute; right:40px; top:56px; width:560px; padding:26px 30px 30px 60px; border-radius:14px;
  background:linear-gradient(270deg, rgba(5,8,12,0.86) 0%, rgba(5,8,12,0.74) 78%, rgba(5,8,12,0) 100%); }
#pn .k { font-weight:800; font-size:20px; letter-spacing:0.4em; color:#ff3b30; }
#pn .h { font-family:"Bebas Neue", sans-serif; font-size:78px; line-height:0.9; margin-top:6px; }
#pn .rule { width:120px; height:3px; background:#ff3b30; margin:12px 0 18px; transform-origin:0 50%; }
.row { display:flex; align-items:center; gap:18px; margin-top:14px; }
.row .th { flex:none; width:84px; height:84px; border-radius:8px; overflow:hidden; border:2px solid rgba(255,255,255,0.85); }
.row .th img { width:100%; height:100%; object-fit:cover; object-position:50% 30%; display:block; }
.row .th.txt { display:flex; align-items:center; justify-content:center; text-align:center; font-weight:800; font-size:18px; line-height:1.1;
  letter-spacing:0.08em; background:#e0302a; }
.row .nm { font-family:"Bebas Neue", sans-serif; font-size:54px; line-height:0.92; }
.row .sb { font-weight:700; font-size:19px; letter-spacing:0.12em; margin-top:4px; color:#e9e9e9; }
.row .sb b { color:#ff3b30; } .row.pca .sb b { color:#6f93ff; } .row.pca .th { border-color:#3f6cf0; }
.row.ath { margin-top:10px; padding-left:102px; } .row.ath .nm { font-size:48px; }
.row.ath .sb { display:inline-block; margin:0 0 0 14px; }

</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="34.0" data-width="1920" data-height="1080"><div id="pn" class="shadow"><div class="k">SHOW DAY · SAT 17 OCT</div><div class="h">4 ATHLETES · 3 SHOWS</div><div class="rule"></div>
<div class="row" id="r1"><div class="th txt">NPC<br>USA</div><div><div class="nm">DANIELLA</div><div class="sb"><b>NPC</b> · WELLNESS · USA</div></div></div>
<div class="row pca" id="r2"><div class="th"><img src="assets/pca.jpg"/></div><div><div class="nm">KATKA</div><div class="sb"><b>PCA BRITISH FINALS</b></div><div class="sb">MASTERS BIKINI</div></div></div>
<div class="row" id="r3"><div class="th"><img src="assets/tbjp.jpg"/></div><div><div class="nm" style="font-size:44px">TBJP INTERNATIONAL BRITISH FINALS</div><div class="sb"><b>2 BROS PRO QUALIFIER</b></div><div class="sb">LIFE CENTRE · BRADFORD</div></div></div>
<div class="row ath" id="r4"><div class="nm">RACHEL</div><div class="sb">· FIT MODEL</div></div>
<div class="row ath" id="r5"><div class="nm">GABRIELLA</div><div class="sb">· BIKINI</div></div></div></div>
<script>(() => { const tl = gsap.timeline({ paused:true }); const f = (s) => Math.round(s*30)/30;
gsap.set(["#pn","#r1","#r2","#r3","#r4","#r5"], { opacity:0 });
tl.fromTo("#pn", { opacity:0, x:60 }, { opacity:1, x:0, duration:f(0.5), ease:"expo.out", immediateRender:false }, f(0.6));
tl.fromTo("#pn .rule", { scaleX:0 }, { scaleX:1, duration:f(0.4), ease:"power3.inOut", immediateRender:false }, f(0.9));
tl.fromTo("#r1", { opacity:0, x:40 }, { opacity:1, x:0, duration:f(0.45), ease:"expo.out", immediateRender:false }, f(8.1));
tl.fromTo("#r2", { opacity:0, x:40 }, { opacity:1, x:0, duration:f(0.45), ease:"back.out(1.4)", immediateRender:false }, f(15.3));
tl.fromTo("#r3", { opacity:0, x:40 }, { opacity:1, x:0, duration:f(0.45), ease:"expo.out", immediateRender:false }, f(20.0));
tl.fromTo("#r4", { opacity:0, x:40 }, { opacity:1, x:0, duration:f(0.45), ease:"power3.out", immediateRender:false }, f(26.1));
tl.fromTo("#r5", { opacity:0, x:40 }, { opacity:1, x:0, duration:f(0.45), ease:"power3.out", immediateRender:false }, f(27.6));
tl.to("#pn", { opacity:0, x:40, duration:f(0.4), ease:"power2.in" }, f(33.5));
tl.to({}, { duration:34.0 }, 0); window.__timelines = window.__timelines || {}; window.__timelines["main"] = tl; })();</script>
</body></html>
