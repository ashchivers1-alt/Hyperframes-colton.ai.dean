<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <!--
      Denisa feature — behind-the-subject client spotlight for the NPC - Youtube intro.
      Covers the 2nd clip of "YouTube – Edit 01" exactly (source 43.3–52.93s, 289 frames):
      "We've also got some training today, which we will be doing with my natural
      wellness client, Denisa, and then tomorrow" (cut).
      Layers: plate → stage → posing window (front/side/rear montage) → duo cut-out pop
      → fg.webm (Ash cut out by the Vision person matte) on top.
      Graphics zone x 40–760 (Ash's head stays right of x≈800). Team Apexx red light.
      Local timing: "training today" ≈1.9, montage 2.0–7.3, "wellness client" ≈7.3,
      "Denisa" ≈7.7, clip ends 9.633.
    -->
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: Montserrat, sans-serif; }
      #plate-wrap, #fg-wrap { position: absolute; inset: 0; }
      #plate, #fg { width: 1920px; height: 1080px; object-fit: cover; }
      #plate-wrap { z-index: 0; }
      #fg-wrap { z-index: 20; }

      #dim {
        position: absolute; inset: 0; z-index: 1; pointer-events: none;
        background:
          radial-gradient(ellipse 46% 95% at 0% 50%, rgba(8, 4, 4, 0.9) 0%, rgba(8, 4, 4, 0.72) 55%, rgba(8, 4, 4, 0) 100%),
          radial-gradient(ellipse 40% 60% at 22% 100%, rgba(8, 4, 4, 0.5) 0%, rgba(8, 4, 4, 0) 100%);
      }
      #beam {
        position: absolute; left: 100px; width: 560px; top: 0; bottom: 0; z-index: 2; pointer-events: none;
        background: radial-gradient(ellipse 50% 92% at 50% 100%, rgba(216, 6, 9, 0.38) 0%, rgba(216, 6, 9, 0) 75%);
        mix-blend-mode: screen; transform-origin: 50% 100%;
      }
      #slit {
        position: absolute; left: 50px; width: 680px; bottom: 6px; height: 4px; z-index: 9; border-radius: 4px;
        background: linear-gradient(90deg, rgba(255,255,255,0), #ffffff 30%, #ffffff 70%, rgba(255,255,255,0));
        box-shadow: 0 0 18px 4px rgba(216, 6, 9, 0.9), 0 0 60px 16px rgba(216, 6, 9, 0.4);
      }
      #ring {
        position: absolute; left: 120px; width: 520px; bottom: 0; height: 110px; z-index: 3; border-radius: 50%;
        border: 3px solid rgba(255, 70, 60, 0.9); box-shadow: 0 0 24px rgba(216, 6, 9, 0.9), inset 0 0 24px rgba(216, 6, 9, 0.4);
        transform: translateY(55px);
      }

      #labels { position: absolute; left: 72px; top: 70px; width: 680px; height: 80px; z-index: 10; }
      .kicker {
        position: absolute; left: 0; top: 0; white-space: nowrap;
        font-weight: 600; font-size: 27px; letter-spacing: 0.3em; color: #f6f6f6;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.85), 0 0 18px rgba(216, 6, 9, 0.5);
      }
      .kicker b { font-weight: 800; color: #ff5148; }
      #rule {
        position: absolute; left: 0; top: 46px; width: 460px; height: 2px; transform-origin: 0 50%;
        background: linear-gradient(90deg, #d80609, rgba(255, 255, 255, 0));
      }

      /* posing window — 9:16 stage footage */
      #win { position: absolute; left: 110px; top: 190px; width: 394px; height: 700px; z-index: 6; border-radius: 22px; overflow: hidden;
        box-shadow: 0 40px 90px rgba(0, 0, 0, 0.7), 0 0 0 2px rgba(255, 110, 100, 0.6), 0 0 60px rgba(216, 6, 9, 0.55); }
      #win-last, #win-video { position: absolute; inset: 0; width: 394px; height: 700px; object-fit: cover; }
      #flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
      .tag {
        position: absolute; left: 18px; bottom: 18px; padding: 6px 14px 5px; border-radius: 6px; z-index: 2;
        font-weight: 800; font-size: 22px; letter-spacing: 0.28em; color: #fff; background: rgba(216, 6, 9, 0.88);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
      }

      /* the photo pop — Ash + Denisa cut out of the backstage photo, bottom on the floor line */
      #duo { position: absolute; left: 24px; top: 196px; width: 430px; height: 882px; z-index: 8; transform-origin: 50% 70%; }
      #duo img { width: 100%; height: 100%; display: block; filter: drop-shadow(0 0 2px rgba(255,255,255,0.9)) drop-shadow(0 0 26px rgba(216, 6, 9, 0.75)) drop-shadow(0 30px 40px rgba(0, 0, 0, 0.6)); }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-jynl" id="root" data-composition-id="main" data-start="0" data-duration="9.633" data-width="1920" data-height="1080">
      <div data-hf-id="hf-ifmw" id="plate-wrap">
        <video data-hf-id="hf-gw1b" id="plate" src="assets/plate.mp4" data-start="0" data-duration="9.633" data-track-index="0" muted playsinline></video>
      </div>
      <audio data-hf-id="hf-qgqg" id="plate-audio" src="assets/plate.mp4" data-start="0" data-duration="9.633" data-track-index="1" data-volume="1"></audio>

      <div data-hf-id="hf-hz4l" id="dim" class="clip" data-start="0" data-duration="9.633" data-track-index="2"></div>
      <div data-hf-id="hf-olvh" id="beam" class="clip" data-start="0" data-duration="9.633" data-track-index="3"></div>
      <div data-hf-id="hf-18z5" id="ring" class="clip" data-start="0" data-duration="9.633" data-track-index="4"></div>

      <div data-hf-id="hf-7on1" id="win">
        <img data-hf-id="hf-hh6h" id="win-last" src="assets/posing-first.jpg" alt="" />
        <video data-hf-id="hf-wlr2" id="win-video" src="assets/posing.mp4" data-start="2.0" data-duration="5.3" data-track-index="6" muted playsinline></video>
        <div data-hf-id="hf-300a" class="tag" id="t1">FRONT</div>
        <div data-hf-id="hf-kle3" class="tag" id="t2">SIDE</div>
        <div data-hf-id="hf-l7y7" class="tag" id="t3">REAR</div>
        <div data-hf-id="hf-hmg5" id="flash"></div>
      </div>

      <div data-hf-id="hf-oisw" id="duo" class="clip" data-start="0" data-duration="9.633" data-track-index="7"><img data-hf-id="hf-lnev" src="assets/duo.png" alt="" /></div>

      <div data-hf-id="hf-h48a" id="labels" class="clip" data-start="0" data-duration="9.633" data-track-index="8">
        <div data-hf-id="hf-g21r" class="kicker" id="k1">TRAINING TODAY · <b data-hf-id="hf-j99a">CLIENT SESSION</b></div>
        <div data-hf-id="hf-of6n" class="kicker" id="k2">CLIENT · <b data-hf-id="hf-cj07">DENISA</b> · NATURAL WELLNESS</div>
        <div data-hf-id="hf-8e4z" id="rule"></div>
      </div>

      <div data-hf-id="hf-1xjk" id="slit" class="clip" data-start="0" data-duration="9.633" data-track-index="9"></div>

      <div data-hf-id="hf-1yip" id="fg-wrap">
        <video data-hf-id="hf-xtzo" id="fg" src="assets/fg.webm" data-start="0" data-duration="9.633" data-track-index="10" muted playsinline></video>
      </div>
    </div>

    <script>
      (() => {
        const tl = gsap.timeline({ paused: true });
        const f = (s) => Math.round(s * 30) / 30;

        gsap.set(["#dim", "#beam", "#slit", "#ring", ".kicker", "#rule", ".tag"], { opacity: 0 });
        gsap.set("#win", { y: 900 });
        gsap.set("#duo", { opacity: 0 });

        // ---- STAGE ON — "training today" (≈1.9): side-stage drops, red slit ignites
        tl.to("#dim", { opacity: 1, duration: f(0.5), ease: "power2.out" }, f(1.5));
        tl.fromTo("#slit", { opacity: 0, scaleX: 0.1 }, { opacity: 1, scaleX: 1, duration: f(0.33), ease: "expo.out", immediateRender: false }, f(1.57));
        tl.fromTo("#beam", { opacity: 0, scaleY: 0.2 }, { opacity: 1, scaleY: 1, duration: f(0.7), ease: "power3.out", immediateRender: false }, f(1.63));

        // posing window rises out of the floor (blur on its own ease — no back.out on filter)
        tl.fromTo("#win", { y: 900, rotation: -6, scale: 0.94 }, { y: 0, rotation: 0, scale: 1, duration: f(0.8), ease: "back.out(1.15)", immediateRender: false }, f(1.7));
        tl.fromTo("#win", { filter: "blur(16px)" }, { filter: "blur(0px)", duration: f(0.47), ease: "power2.out", immediateRender: false }, f(1.7));
        tl.fromTo("#ring", { opacity: 0.95, scale: 0.35 }, { opacity: 0, scale: 1.5, duration: f(0.8), ease: "power2.out", immediateRender: false }, f(1.83));
        tl.fromTo("#k1", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: f(0.4), ease: "expo.out", immediateRender: false }, f(2.0));
        tl.fromTo("#rule", { opacity: 1, scaleX: 0 }, { scaleX: 1, duration: f(0.5), ease: "power2.inOut", immediateRender: false }, f(2.2));
        tl.to("#win", { y: -10, duration: f(1.6), ease: "sine.inOut", yoyo: true, repeat: 2 }, f(2.6));

        // ---- MONTAGE — front (2.0) / side (3.9) / rear (5.6): flash hides each cut, tag swaps
        const flash = (t) => tl.fromTo("#flash", { opacity: 0.85 }, { opacity: 0, duration: f(0.27), ease: "power2.out", immediateRender: false }, f(t));
        const tagIn = (sel, t) => tl.fromTo(sel, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: f(0.27), ease: "power2.out", immediateRender: false }, f(t));
        const tagOut = (sel, t) => tl.to(sel, { opacity: 0, duration: f(0.13), ease: "power1.in" }, f(t));
        tagIn("#t1", 2.3);
        flash(3.9); tagOut("#t1", 3.83); tagIn("#t2", 3.97);
        flash(5.6); tagOut("#t2", 5.53); tagIn("#t3", 5.67);

        // ---- POP — "wellness client … Denisa" (7.3 / 7.7): white flash, the photo cut-out bursts out of the window
        tl.fromTo("#flash", { opacity: 0 }, { opacity: 1, duration: f(0.13), ease: "power2.in", immediateRender: false }, f(7.2));
        tagOut("#t3", 7.2);
        tl.to("#win", { scale: 0.86, opacity: 0, filter: "blur(6px)", duration: f(0.4), ease: "power2.out" }, f(7.33));
        tl.fromTo("#duo", { opacity: 0, scale: 0.45, y: 60 }, { opacity: 1, scale: 1, y: 0, duration: f(0.6), ease: "back.out(1.6)", immediateRender: false }, f(7.33));
        tl.fromTo("#ring", { opacity: 0.95, scale: 0.35 }, { opacity: 0, scale: 1.6, duration: f(0.8), ease: "power2.out", immediateRender: false }, f(7.4));
        tl.to("#k1", { opacity: 0, y: -14, duration: f(0.2), ease: "power2.in" }, f(7.27));
        tl.fromTo("#k2", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: f(0.4), ease: "expo.out", immediateRender: false }, f(7.5));
        tl.to("#duo", { scale: 1.03, duration: f(1.3), ease: "none" }, f(7.93));

        // ---- OUT (8.93–9.53): everything sinks back into the floor; clean before the cut at 9.633
        tl.to("#duo", { y: 950, filter: "blur(14px)", duration: f(0.43), ease: "power2.in" }, f(8.93));
        tl.to("#win", { y: 950, duration: f(0.43), ease: "power2.in" }, f(8.97));
        tl.to(["#k2", "#rule"], { opacity: 0, y: 24, duration: f(0.3), ease: "power2.in" }, f(8.9));
        tl.to(["#slit", "#beam"], { opacity: 0, duration: f(0.27), ease: "power1.in" }, f(9.13));
        tl.to("#dim", { opacity: 0, duration: f(0.4), ease: "power1.inOut" }, f(9.1));

        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
