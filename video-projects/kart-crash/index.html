<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/brand-tokens.css" />
    <!--
      KART CRASH — slow-mo impact reel (draft 1, before Ash's editing notes).
      Base plate = assets/base.mp4 from scripts/build_base.sh. Segment times in the plate:
        A build-up 0–1.20 · B impact 0.25x 1.20–2.73 · C freeze 2.73–4.27 · D aftermath 0.5x 4.27–5.07
        E replay 0.2x 5.07–7.97 · F end hold 7.97–8.97
      Ash = red-suit driver who gets launched. Top/bottom bands left clear for hook text later.
    -->
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: Inter, sans-serif; }
      #shake { position: absolute; inset: 0; }
      #plate { width: 1080px; height: 1920px; object-fit: cover; }
      #vig { position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse 75% 60% at 50% 48%, transparent 45%, rgba(0,0,0,.55) 100%); }
      #tint { position: absolute; inset: 0; pointer-events: none; background: rgba(216,6,9,.18); mix-blend-mode: multiply; opacity: 0; }
      #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
      #bars { position: absolute; inset: 0; pointer-events: none; opacity: 0;
        background: linear-gradient(180deg, #000 0, #000 284px, transparent 284px, transparent 1636px, #000 1636px); }

      .badge { position: absolute; display: flex; align-items: center; gap: 12px; height: 64px; padding: 0 22px; border-radius: 14px;
        font: 900 34px/1 Montserrat, sans-serif; letter-spacing: .06em; color: #fff; white-space: nowrap; opacity: 0; }
      .badge.red { background: var(--brand-accent); box-shadow: 0 0 30px rgba(216,6,9,.55); }
      .badge.dark { background: rgba(10,10,10,.82); border: 2px solid rgba(255,255,255,.18); }
      .rec { width: 18px; height: 18px; border-radius: 50%; background: #fff; }
      #slow { left: 48px; top: 318px; }
      #replay { left: 48px; top: 318px; }
      #speed2 { right: 48px; top: 318px; }

      #ring { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; pointer-events: none; opacity: 0; }
      #ring ellipse { fill: none; stroke: var(--brand-accent); stroke-width: 12; filter: drop-shadow(0 0 14px rgba(216,6,9,.9)); }
      #me { position: absolute; left: 445px; top: 585px; height: 76px; padding: 0 26px; border-radius: 16px; background: #fff; color: #0a0a0a;
        display: flex; align-items: center; font: 900 44px/1 Montserrat, sans-serif; white-space: nowrap; opacity: 0;
        box-shadow: 0 12px 30px rgba(0,0,0,.45); }
      #hook { position: absolute; left: 50px; right: 50px; top: 92px; text-align: center; font: 900 66px/1.04 Montserrat, sans-serif; color: #fff; letter-spacing: -0.01em;
        text-shadow: 0 0 2px #000, 0 3px 0 #000, 0 -3px 0 #000, 3px 0 0 #000, -3px 0 0 #000, 0 8px 26px rgba(0,0,0,.6); opacity: 0; }
      #hook .y { color: #FFD400; }
      #ring2 { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; pointer-events: none; opacity: 0; }
      #ring2 circle { fill: none; stroke: #FFD400; stroke-width: 11; filter: drop-shadow(0 0 14px rgba(255,212,0,.85)); }
      #burst { position: absolute; left: 830px; top: 1000px; width: 0; height: 0; pointer-events: none; opacity: 0; }
      #burst i { position: absolute; left: -6px; top: -110px; width: 12px; height: 70px; border-radius: 6px; background: #fff; box-shadow: 0 0 18px rgba(255,255,255,.9); transform-origin: 6px 110px; }
      #victim { position: absolute; left: 400px; top: 1130px; height: 76px; padding: 0 26px; border-radius: 16px; background: #FFD400; color: #0a0a0a;
        display: flex; align-items: center; font: 900 42px/1 Montserrat, sans-serif; white-space: nowrap; opacity: 0; box-shadow: 0 12px 30px rgba(0,0,0,.45); }
      #impact { position: absolute; left: 0; right: 0; top: 1330px; text-align: center; font: 900 150px/1 Montserrat, sans-serif; color: var(--brand-accent); letter-spacing: .02em;
        text-shadow: 0 0 30px rgba(216,6,9,.7), 0 6px 0 #000; opacity: 0; transform: rotate(-4deg); }
      #me::after { content: ""; position: absolute; left: 50%; bottom: -16px; margin-left: -12px; border: 12px solid transparent; border-top: 16px solid #fff; border-bottom: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="11.73" data-width="1080" data-height="1920">
      <div id="shake">
        <video id="plate" src="assets/base.mp4" data-start="0" data-duration="11.73" data-track-index="0" muted playsinline></video>
      </div>
      <audio id="amb" src="assets/ambient.m4a" data-start="0" data-duration="1.2" data-track-index="1" data-volume="0.7"></audio>

      <div id="fx" class="clip" data-start="0" data-duration="11.73" data-track-index="2">
        <div id="vig"></div>
        <div id="tint"></div>
        <svg id="ring" viewBox="0 0 1080 1920"><ellipse id="ring-e" cx="600" cy="930" rx="175" ry="235" /></svg>
        <div id="hook">SUM UP YOUR WEEKEND RACING IN <span class="y">SPAIN</span></div>
        <svg id="ring2" viewBox="0 0 1080 1920"><circle id="ring2-c" cx="650" cy="950" r="150" /></svg>
        <div id="burst"><i style="transform:rotate(0deg)"></i><i style="transform:rotate(45deg)"></i><i style="transform:rotate(90deg)"></i><i style="transform:rotate(135deg)"></i><i style="transform:rotate(180deg)"></i><i style="transform:rotate(225deg)"></i><i style="transform:rotate(270deg)"></i><i style="transform:rotate(315deg)"></i></div>
        <div id="victim">THE GUY I HIT</div>
        <div id="impact">IMPACT</div>
        <div id="slow" class="badge red"><span class="rec"></span>SLOW-MO 0.15×</div>
        <div id="replay" class="badge red"><span class="rec"></span>REPLAY</div>
        <div id="speed2" class="badge dark">0.1×</div>
        <div id="flash"></div>
      </div>

      <!-- SFX -->
      <audio id="s1" src="assets/sfx/riser.mp3" data-start="0.2" data-duration="1.0" data-track-index="10" data-volume="0.3"></audio>
      <audio id="s2" src="assets/sfx/whoosh.mp3" data-start="1.12" data-duration="0.57" data-track-index="11" data-volume="0.35"></audio>
      <audio id="s3" src="assets/sfx/boom.mp3" data-start="2.2" data-duration="2.7" data-track-index="12" data-volume="0.55"></audio>
      <audio id="s4" src="assets/sfx/slam.mp3" data-start="3.7" data-duration="1.2" data-track-index="10" data-volume="0.45"></audio>
      <audio id="s5" src="assets/sfx/swipe.mp3" data-start="6.33" data-duration="1.05" data-track-index="11" data-volume="0.3"></audio>
      <audio id="s6" src="assets/sfx/slam.mp3" data-start="7.3" data-duration="1.2" data-track-index="12" data-volume="0.35"></audio>
      <audio id="s7" src="assets/sfx/boom.mp3" data-start="9.2" data-duration="2.5" data-track-index="10" data-volume="0.6"></audio>
      <audio id="s8" src="assets/sfx/bass-drop.mp3" data-start="9.22" data-duration="1.15" data-track-index="13" data-volume="0.55"></audio>
                                                    </div>

    <script>
      (() => {
        const tl = gsap.timeline({ paused: true });
        const DUR = 11.73;
        const SHAKE = (t, amp = 22, n = 8) => {
          const kf = [];
          for (let i = 0; i < n; i++) {
            const d = amp * (1 - i / n);
            kf.push({ x: (i % 2 ? -1 : 1) * d, y: (i % 3 ? 1 : -1) * d * 0.6, rotation: (i % 2 ? -1 : 1) * d * 0.04, duration: 0.033 });
          }
          kf.push({ x: 0, y: 0, rotation: 0, duration: 0.05 });
          tl.to("#shake", { keyframes: kf }, t);
        };
        const FLASH = (t, a = 0.9, d = 0.35) => tl.fromTo("#flash", { opacity: a }, { opacity: 0, duration: d, ease: "power2.out", immediateRender: false }, t);
        const BADGE = (s, t) => tl.fromTo(s, { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.25, ease: "back.out(2)" }, t);

        tl.fromTo("#hook", { opacity: 0.4, y: -12 }, { opacity: 1, y: 0, duration: 0.2, ease: "power3.out" }, 0);
        // A build-up 0–1.2 → hard push into slow-mo
        tl.fromTo("#shake", { scale: 1 }, { scale: 1.06, duration: 1.2, ease: "power1.in" }, 0);
        tl.set("#shake", { scale: 1 }, 1.2);
        FLASH(1.2, 0.35, 0.25);
        BADGE("#slow", 1.25);
        tl.to("#shake", { scale: 1.14, duration: 2.5, ease: "none" }, 1.2);

        // B impact at 0.15x (1.2–3.7) — launch ≈ 2.2
        FLASH(2.2, 0.8, 0.45);
        SHAKE(2.2, 26, 12);
        tl.to("#slow", { opacity: 0, duration: 0.15 }, 3.55);

        // C freeze on Ash (3.7–5.23) — red tint + ring
        tl.set("#shake", { scale: 1 }, 3.7);
        FLASH(3.7, 0.85, 0.4);
        SHAKE(3.7, 18, 6);
        tl.to("#tint", { opacity: 1, duration: 0.2 }, 3.72);
        tl.set("#ring", { opacity: 1 }, 3.82);
        tl.fromTo("#ring-e", { strokeDasharray: 1300, strokeDashoffset: 1300 }, { strokeDashoffset: 0, duration: 0.45, ease: "power3.out" }, 3.82);
        tl.to("#ring-e", { strokeWidth: 16, duration: 0.3, yoyo: true, repeat: 3, ease: "sine.inOut" }, 4.3);
        tl.to(["#ring", "#tint"], { opacity: 0, duration: 0.18 }, 5.05);

        // D aftermath 0.33x (5.23–6.4), E replay on the yellow-helmet driver
        FLASH(6.4, 0.6, 0.3);
        BADGE("#replay", 6.43);
        tl.fromTo("#speed2", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.25, ease: "back.out(2)" }, 6.5);
        tl.fromTo("#shake", { scale: 1 }, { scale: 1.06, duration: 0.9, ease: "none" }, 6.4);
        // E2 freeze on the driver I hit (7.3–8.7)
        tl.set("#shake", { scale: 1 }, 7.3);
        FLASH(7.3, 0.9, 0.35);
        tl.set("#ring2", { opacity: 1 }, 7.37);
        tl.fromTo("#ring2-c", { strokeDasharray: 1000, strokeDashoffset: 1000 }, { strokeDashoffset: 0, duration: 0.4, ease: "power3.out" }, 7.37);
        tl.fromTo("#victim", { opacity: 0, y: 30, scale: 0.7 }, { opacity: 1, y: 0, scale: 1, duration: 0.3, ease: "back.out(2.2)" }, 7.62);
        tl.to("#ring2-c", { strokeWidth: 15, duration: 0.25, yoyo: true, repeat: 3, ease: "sine.inOut" }, 7.9);
        tl.to(["#ring2", "#victim"], { opacity: 0, duration: 0.12 }, 8.58);
        // E3 contact at 0.1x (8.7–10.73) — impact lands ≈ 9.2
        tl.fromTo("#shake", { scale: 1 }, { scale: 1.12, duration: 2.0, ease: "power2.out" }, 8.7);
        FLASH(9.2, 0.8, 0.45);
        SHAKE(9.2, 34, 14);
        tl.fromTo("#burst", { opacity: 1, scale: 0.3 }, { opacity: 0, scale: 2.4, duration: 0.7, ease: "expo.out", immediateRender: false }, 9.2);
        tl.fromTo("#impact", { opacity: 0, scale: 2.4 }, { opacity: 1, scale: 1, duration: 0.18, ease: "power4.in" }, 9.23);
        tl.to("#impact", { scale: 1.08, duration: 1.2, ease: "none" }, 9.41);
        tl.to("#impact", { opacity: 0, duration: 0.15 }, 10.6);
        tl.set("#shake", { scale: 1.12 }, 10.733);
        tl.to(["#replay", "#speed2"], { opacity: 0, duration: 0.2 }, 11.4);

        tl.to({}, { duration: DUR }, 0);
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
