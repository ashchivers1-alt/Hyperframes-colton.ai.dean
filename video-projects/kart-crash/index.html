<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/brand-tokens.css" />
    <!--
      KART CRASH — slow-mo impact reel (draft 1, before Ash's editing notes).
      Base plate = assets/base.mp4 from scripts/build_base.sh. Segment times in the plate:
        A build-up 0–1.20 · B impact 0.25x 1.20–2.73 · C freeze 2.73–4.27 · D aftermath 0.5x 4.27–5.07
        E replay 0.2x 5.07–7.97 · F end hold 7.97–8.97
      Ash = red-suit driver who gets launched. Top/bottom bands left clear for hook text later.
    -->
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: Inter, sans-serif; }
      #shake { position: absolute; inset: 0; }
      #plate { width: 1080px; height: 1920px; object-fit: cover; }
      #vig { position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse 75% 60% at 50% 48%, transparent 45%, rgba(0,0,0,.55) 100%); }
      #tint { position: absolute; inset: 0; pointer-events: none; background: rgba(216,6,9,.18); mix-blend-mode: multiply; opacity: 0; }
      #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
      #bars { position: absolute; inset: 0; pointer-events: none; opacity: 0;
        background: linear-gradient(180deg, #000 0, #000 284px, transparent 284px, transparent 1636px, #000 1636px); }

      .badge { position: absolute; display: flex; align-items: center; gap: 12px; height: 64px; padding: 0 22px; border-radius: 14px;
        font: 900 34px/1 Montserrat, sans-serif; letter-spacing: .06em; color: #fff; white-space: nowrap; opacity: 0; }
      .badge.red { background: var(--brand-accent); box-shadow: 0 0 30px rgba(216,6,9,.55); }
      .badge.dark { background: rgba(10,10,10,.82); border: 2px solid rgba(255,255,255,.18); }
      .rec { width: 18px; height: 18px; border-radius: 50%; background: #fff; }
      #slow { left: 48px; top: 318px; }
      #replay { left: 48px; top: 318px; }
      #speed2 { right: 48px; top: 318px; }

      #ring { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; pointer-events: none; opacity: 0; }
      #ring ellipse { fill: none; stroke: var(--brand-accent); stroke-width: 12; filter: drop-shadow(0 0 14px rgba(216,6,9,.9)); }
      #me { position: absolute; left: 790px; top: 640px; height: 76px; padding: 0 26px; border-radius: 16px; background: #fff; color: #0a0a0a;
        display: flex; align-items: center; font: 900 44px/1 Montserrat, sans-serif; white-space: nowrap; opacity: 0;
        box-shadow: 0 12px 30px rgba(0,0,0,.45); }
      #me::after { content: ""; position: absolute; left: -16px; top: 26px; border: 12px solid transparent; border-right: 16px solid #fff; border-left: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8.96" data-width="1080" data-height="1920">
      <div id="shake">
        <video id="plate" src="assets/base.mp4" data-start="0" data-duration="8.96" data-track-index="0" muted playsinline></video>
      </div>
      <audio id="amb" src="assets/ambient.m4a" data-start="0" data-duration="1.2" data-track-index="1" data-volume="0.7"></audio>

      <div id="fx" class="clip" data-start="0" data-duration="8.96" data-track-index="2">
        <div id="vig"></div>
        <div id="tint"></div>
        <svg id="ring" viewBox="0 0 1080 1920"><ellipse id="ring-e" cx="600" cy="930" rx="175" ry="235" /></svg>
        <div id="me">THAT'S ME</div>
        <div id="slow" class="badge red"><span class="rec"></span>SLOW-MO 0.25×</div>
        <div id="replay" class="badge red"><span class="rec"></span>REPLAY</div>
        <div id="speed2" class="badge dark">0.2×</div>
        <div id="flash"></div>
      </div>

      <!-- SFX -->
      <audio id="s1" src="assets/sfx/riser.mp3" data-start="0.2" data-duration="1.0" data-track-index="10" data-volume="0.3"></audio>
      <audio id="s2" src="assets/sfx/whoosh.mp3" data-start="1.12" data-duration="0.57" data-track-index="11" data-volume="0.35"></audio>
      <audio id="s3" src="assets/sfx/boom.mp3" data-start="1.95" data-duration="2.6" data-track-index="12" data-volume="0.55"></audio>
      <audio id="s4" src="assets/sfx/slam.mp3" data-start="2.73" data-duration="1.2" data-track-index="10" data-volume="0.45"></audio>
      <audio id="s5" src="assets/sfx/swipe.mp3" data-start="5.0" data-duration="1.05" data-track-index="11" data-volume="0.3"></audio>
      <audio id="s6" src="assets/sfx/bass-drop.mp3" data-start="6.05" data-duration="1.15" data-track-index="13" data-volume="0.5"></audio>
    </div>

    <script>
      (() => {
        const tl = gsap.timeline({ paused: true });
        const DUR = 8.96;
        const SHAKE = (t, amp = 22, n = 8) => {
          const kf = [];
          for (let i = 0; i < n; i++) {
            const d = amp * (1 - i / n);
            kf.push({ x: (i % 2 ? -1 : 1) * d, y: (i % 3 ? 1 : -1) * d * 0.6, rotation: (i % 2 ? -1 : 1) * d * 0.04, duration: 0.033 });
          }
          kf.push({ x: 0, y: 0, rotation: 0, duration: 0.05 });
          tl.to("#shake", { keyframes: kf }, t);
        };
        const FLASH = (t, a = 0.9, d = 0.35) => tl.fromTo("#flash", { opacity: a }, { opacity: 0, duration: d, ease: "power2.out", immediateRender: false }, t);
        const BADGE = (s, t) => tl.fromTo(s, { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.25, ease: "back.out(2)" }, t);

        // build-up → hard push into slow-mo
        tl.fromTo("#shake", { scale: 1 }, { scale: 1.06, duration: 1.2, ease: "power1.in" }, 0);
        tl.set("#shake", { scale: 1 }, 1.2);
        FLASH(1.2, 0.35, 0.25);
        BADGE("#slow", 1.25);
        tl.to("#shake", { scale: 1.12, duration: 1.5, ease: "none" }, 1.2);

        // impact
        FLASH(1.98, 0.85, 0.4);
        SHAKE(1.98, 26, 10);
        tl.to("#slow", { opacity: 0, duration: 0.15 }, 2.6);

        // freeze — red tint, ring draws on, THAT'S ME
        tl.set("#shake", { scale: 1 }, 2.73);
        FLASH(2.73, 1, 0.45);
        SHAKE(2.73, 18, 6);
        tl.to("#tint", { opacity: 1, duration: 0.2 }, 2.75);
        tl.set("#ring", { opacity: 1 }, 2.85);
        tl.fromTo("#ring-e", { strokeDasharray: 1300, strokeDashoffset: 1300 }, { strokeDashoffset: 0, duration: 0.45, ease: "power3.out" }, 2.85);
        tl.fromTo("#me", { opacity: 0, x: 40, scale: 0.7 }, { opacity: 1, x: 0, scale: 1, duration: 0.3, ease: "back.out(2.2)" }, 3.15);
        tl.to("#ring-e", { strokeWidth: 16, duration: 0.3, yoyo: true, repeat: 3, ease: "sine.inOut" }, 3.35);
        tl.to(["#ring", "#me", "#tint"], { opacity: 0, duration: 0.18 }, 4.1);

        // aftermath + replay
        FLASH(5.07, 0.6, 0.3);
        BADGE("#replay", 5.1);
        tl.fromTo("#speed2", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.25, ease: "back.out(2)" }, 5.2);
        tl.fromTo("#shake", { scale: 1 }, { scale: 1.08, duration: 2.9, ease: "none" }, 5.07);
        FLASH(6.05, 0.75, 0.4);
        SHAKE(6.05, 20, 8);
        tl.set("#shake", { scale: 1.08 }, 7.97);
        tl.to(["#replay", "#speed2"], { opacity: 0, duration: 0.2 }, 8.6);

        tl.to({}, { duration: DUR }, 0);
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
