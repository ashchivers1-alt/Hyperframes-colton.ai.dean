    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }

      #plate-wrap, #fg-wrap { position: absolute; inset: 0; }

      #dim {
        position: absolute; inset: 0; z-index: 1; pointer-events: none;
        background:
          radial-gradient(ellipse 48% 95% at 0% 50%, rgba(8, 4, 4, 0.9) 0%, rgba(8, 4, 4, 0.72) 55%, rgba(8, 4, 4, 0) 100%),
          radial-gradient(ellipse 40% 60% at 22% 100%, rgba(8, 4, 4, 0.5) 0%, rgba(8, 4, 4, 0) 100%);

      #beam {
        position: absolute; left: 80px; width: 600px; top: 0; bottom: 0; z-index: 2; pointer-events: none;
        background: radial-gradient(ellipse 50% 92% at 50% 100%, rgba(216, 6, 9, 0.38) 0%, rgba(216, 6, 9, 0) 75%);
        mix-blend-mode: screen; transform-origin: 50% 100%;
      }
      #slit {
        position: absolute; left: 40px; width: 700px; bottom: 6px; height: 4px; z-index: 9; border-radius: 4px;
        background: linear-gradient(90deg, rgba(255,255,255,0), #ffffff 30%, #ffffff 70%, rgba(255,255,255,0));
        box-shadow: 0 0 18px 4px rgba(216, 6, 9, 0.9), 0 0 60px 16px rgba(216, 6, 9, 0.4);
      }
      #ring {
        position: absolute; left: 110px; width: 540px; bottom: 0; height: 110px; z-index: 3; border-radius: 50%;
        border: 3px solid rgba(255, 70, 60, 0.9); box-shadow: 0 0 24px rgba(216, 6, 9, 0.9), inset 0 0 24px rgba(216, 6, 9, 0.4);
        transform: translateY(55px);

      #labels { position: absolute; left: 500px; top: 44px; width: 680px; height: 80px; z-index: 12; }

        font-weight: 600; font-size: 24px; letter-spacing: 0.3em; color: #f6f6f6;

      }
      .kicker b { font-weight: 800; color: #ff5148; }
      #rule {
        position: absolute; left: 0; top: 46px; width: 460px; height: 2px; transform-origin: 0 50%;
        background: linear-gradient(90deg, #d80609, rgba(255, 255, 255, 0));
      }

      .persp { position: absolute; left: 0; top: 0; width: 800px; height: 1080px; perspective: 1100px; z-index: 6; }

      .frame {
        position: absolute; overflow: hidden; border-radius: 18px;
