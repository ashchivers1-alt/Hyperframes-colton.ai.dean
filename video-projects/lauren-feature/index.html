<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <!--
      Lauren feature — 3D "out of bounds" stage photos behind Ash.
      Covers the 3rd clip of "YouTube – Edit 01" exactly (source 53.33–60.5s, 215 frames):
      "we're also training with my natural wellness client, Lauren. So two days back to back,
      which I'm not really looking forward to."
      Each beat: a framed photo swings in on a 3D card, then Lauren's cut-out (Vision subject
      lift, same size/position as the photo) breaks out over the top edge of the frame.
      Layers: plate → stage → cards → fg.webm (Ash, Vision person matte) on top.
      Graphics zone x 0–760 (Ash's head stays right of x≈1000). Team Apexx red light.
      Local word timings: "training" 0.58, "Lauren" 2.75, "two days" 3.37, "back to back" 4.27–5.06,
      "looking forward to" 6.48–6.9, clip ends 7.167.
    -->
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: Montserrat, sans-serif; }
      #plate-wrap, #fg-wrap { position: absolute; inset: 0; }
      #plate, #fg { width: 1920px; height: 1080px; object-fit: cover; }
      #plate-wrap { z-index: 0; }
      #fg-wrap { z-index: 20; }

      #dim {
        position: absolute; inset: 0; z-index: 1; pointer-events: none;
        background:
          radial-gradient(ellipse 48% 95% at 0% 50%, rgba(8, 4, 4, 0.9) 0%, rgba(8, 4, 4, 0.72) 55%, rgba(8, 4, 4, 0) 100%),
          radial-gradient(ellipse 40% 60% at 22% 100%, rgba(8, 4, 4, 0.5) 0%, rgba(8, 4, 4, 0) 100%);
      }
      #beam {
        position: absolute; left: 80px; width: 600px; top: 0; bottom: 0; z-index: 2; pointer-events: none;
        background: radial-gradient(ellipse 50% 92% at 50% 100%, rgba(216, 6, 9, 0.38) 0%, rgba(216, 6, 9, 0) 75%);
        mix-blend-mode: screen; transform-origin: 50% 100%;
      }
      #slit {
        position: absolute; left: 40px; width: 700px; bottom: 6px; height: 4px; z-index: 9; border-radius: 4px;
        background: linear-gradient(90deg, rgba(255,255,255,0), #ffffff 30%, #ffffff 70%, rgba(255,255,255,0));
        box-shadow: 0 0 18px 4px rgba(216, 6, 9, 0.9), 0 0 60px 16px rgba(216, 6, 9, 0.4);
      }
      #ring {
        position: absolute; left: 110px; width: 540px; bottom: 0; height: 110px; z-index: 3; border-radius: 50%;
        border: 3px solid rgba(255, 70, 60, 0.9); box-shadow: 0 0 24px rgba(216, 6, 9, 0.9), inset 0 0 24px rgba(216, 6, 9, 0.4);
        transform: translateY(55px);
      }

      #labels { position: absolute; left: 500px; top: 44px; width: 680px; height: 80px; z-index: 12; }
      .kicker {
        position: absolute; left: 0; top: 0; white-space: nowrap;
        font-weight: 600; font-size: 24px; letter-spacing: 0.3em; color: #f6f6f6;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.85), 0 0 18px rgba(216, 6, 9, 0.5);
      }
      .kicker b { font-weight: 800; color: #ff5148; }
      #rule {
        position: absolute; left: 0; top: 46px; width: 460px; height: 2px; transform-origin: 0 50%;
        background: linear-gradient(90deg, #d80609, rgba(255, 255, 255, 0));
      }

      /* 3D stage — each card swings on Y around the frame's centre */
      .persp { position: absolute; left: 0; top: 0; width: 800px; height: 1080px; perspective: 1100px; z-index: 6; }
      .card { position: absolute; transform-style: preserve-3d; }
      .frame {
        position: absolute; overflow: hidden; border-radius: 18px;
        box-shadow: 0 40px 90px rgba(0, 0, 0, 0.75), 0 0 0 3px rgba(255, 255, 255, 0.92), 0 0 0 7px rgba(216, 6, 9, 0.85), 0 0 60px rgba(216, 6, 9, 0.6);
      }
      .frame img { position: absolute; display: block; }
      .cut { position: absolute; left: 0; top: 0; display: block; transform-origin: 50% 85%;
        filter: drop-shadow(0 0 2px rgba(255,255,255,0.85)) drop-shadow(0 22px 26px rgba(0,0,0,0.7)); }
      .ptag {
        position: absolute; padding: 5px 12px 4px; border-radius: 6px;
        font-weight: 800; font-size: 19px; letter-spacing: 0.28em; color: #fff; background: rgba(216, 6, 9, 0.92);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
      }

      /* cards sit in the clear upper-left (y 100–590): Ash's arm/shoulder fills the lower-left in this clip */
      /* card A — podium (1638x2048 → 590x738); frame x151 y245 w285 h381 */
      #cA { left: -1px; top: -60px; width: 590px; height: 738px; transform-origin: 293px 435px; }
      #cA .frame { left: 151px; top: 245px; width: 285px; height: 381px; }
      #cA .frame img, #cA .cut { width: 590px; height: 738px; }
      #cA .frame img { left: -151px; top: -245px; }
      #cA .ptag { left: 165px; top: 580px; }
      /* card B — rear (1152x2048 → 574x1022); frame x140 y493 w285 h380 */
      #cB { left: 10px; top: -308px; width: 574px; height: 1022px; transform-origin: 283px 682px; }
      #cB .frame { left: 140px; top: 493px; width: 285px; height: 380px; }
      #cB .frame img, #cB .cut { width: 574px; height: 1022px; }
      #cB .frame img { left: -140px; top: -493px; }
      #cB .ptag { left: 154px; top: 826px; }
      /* card C — Ash + Lauren (1840² → 626x626); frame x159 y193 w308 h402 */
      #cC { left: -9px; top: -8px; width: 626px; height: 626px; transform-origin: 313px 393px; }
      #cC .frame { left: 159px; top: 193px; width: 308px; height: 402px; }
      #cC .frame img, #cC .cut { width: 626px; height: 626px; }
      #cC .frame img { left: -159px; top: -193px; }
      #cC .ptag { left: 172px; top: 550px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="7.167" data-width="1920" data-height="1080">
      <div id="plate-wrap">
        <video id="plate" src="assets/plate.mp4" data-start="0" data-duration="7.167" data-track-index="0" muted playsinline></video>
      </div>
      <audio id="plate-audio" src="assets/plate.mp4" data-start="0" data-duration="7.167" data-track-index="1" data-volume="1"></audio>

      <div id="dim" class="clip" data-start="0" data-duration="7.167" data-track-index="2"></div>
      <div id="beam" class="clip" data-start="0" data-duration="7.167" data-track-index="3"></div>
      <div id="ring" class="clip" data-start="0" data-duration="7.167" data-track-index="4"></div>

      <div id="stage" class="persp clip" data-start="0" data-duration="7.167" data-track-index="5">
        <div class="card" id="cA">
          <div class="frame"><img src="assets/podium.jpg" alt="" /></div>
          <img class="cut" src="assets/podium-cut.png" alt="" />
          <div class="ptag">1ST PLACE</div>
        </div>
        <div class="card" id="cB">
          <div class="frame"><img src="assets/rear.jpg" alt="" /></div>
          <img class="cut" src="assets/rear-cut.png" alt="" />
          <div class="ptag">ON STAGE</div>
        </div>
        <div class="card" id="cC">
          <div class="frame"><img src="assets/duo.jpg" alt="" /></div>
          <img class="cut" src="assets/duo-cut.png" alt="" />
          <div class="ptag">TEAM APEXX</div>
        </div>
      </div>

      <div id="labels" class="clip" data-start="0" data-duration="7.167" data-track-index="6">
        <div class="kicker" id="k1">TRAINING TOMORROW · <b>CLIENT SESSION</b></div>
        <div class="kicker" id="k2">CLIENT · <b>LAUREN</b> · NATURAL WELLNESS</div>
        <div class="kicker" id="k3"><b>2 DAYS</b> · BACK TO BACK</div>
        <div id="rule"></div>
      </div>

      <div id="slit" class="clip" data-start="0" data-duration="7.167" data-track-index="7"></div>

      <div id="fg-wrap">
        <video id="fg" src="assets/fg.webm" data-start="0" data-duration="7.167" data-track-index="8" muted playsinline></video>
      </div>
    </div>

    <script>
      (() => {
        const tl = gsap.timeline({ paused: true });
        const f = (s) => Math.round(s * 30) / 30;

        // frame-top inset per card (px from the top of the card) — the cut-out is clipped there until it "steps out"
        const TOP = { cA: 245, cB: 493, cC: 193 };
        gsap.set(["#dim", "#beam", "#slit", "#ring", ".kicker", "#rule"], { opacity: 0 });
        gsap.set(".card", { opacity: 0 });
        gsap.set(".ptag", { opacity: 0 });
        Object.entries(TOP).forEach(([id, top]) => gsap.set(`#${id} .cut`, { clipPath: `inset(${top}px 0px 0px 0px)` }));

        const ring = (t) => tl.fromTo("#ring", { opacity: 0.95, scale: 0.35 }, { opacity: 0, scale: 1.55, duration: f(0.8), ease: "power2.out", immediateRender: false }, f(t));
        const kickIn = (sel, t) => tl.fromTo(sel, { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: f(0.37), ease: "expo.out", immediateRender: false }, f(t));
        const kickOut = (sel, t) => tl.to(sel, { opacity: 0, y: -14, duration: f(0.2), ease: "power2.in" }, f(t));
        // the pop: clip opens to the top of the card, the cut-out leans forward out of the frame
        const pop = (id, t) => {
          tl.to(`#${id} .cut`, { clipPath: "inset(0px 0px 0px 0px)", duration: f(0.4), ease: "power3.out" }, f(t));
          tl.fromTo(`#${id} .cut`, { scale: 1 }, { scale: 1.07, y: -10, duration: f(0.5), ease: "back.out(2)", immediateRender: false }, f(t));
          tl.fromTo(`#${id} .ptag`, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: f(0.27), ease: "power2.out", immediateRender: false }, f(t + 0.17));
          ring(t);
        };

        // ---- STAGE ON
        tl.to("#dim", { opacity: 1, duration: f(0.4), ease: "power2.out" }, f(0.07));
        tl.fromTo("#slit", { opacity: 0, scaleX: 0.1 }, { opacity: 1, scaleX: 1, duration: f(0.3), ease: "expo.out", immediateRender: false }, f(0.1));
        tl.fromTo("#beam", { opacity: 0, scaleY: 0.2 }, { opacity: 1, scaleY: 1, duration: f(0.6), ease: "power3.out", immediateRender: false }, f(0.13));
        kickIn("#k1", 0.3);
        tl.fromTo("#rule", { opacity: 1, scaleX: 0 }, { scaleX: 1, duration: f(0.45), ease: "power2.inOut", immediateRender: false }, f(0.45));

        // ---- CARD A — podium: rises out of the floor on a 3D swing, Lauren steps out on "training"
        tl.fromTo("#cA", { opacity: 1, y: 900, rotationY: 38, rotationX: 10 }, { opacity: 1, y: 0, rotationY: 14, rotationX: 3, duration: f(0.7), ease: "power3.out", immediateRender: false }, f(0.17));
        tl.fromTo("#cA", { filter: "blur(14px)" }, { filter: "blur(0px)", duration: f(0.43), ease: "power2.out", immediateRender: false }, f(0.17));
        pop("cA", 0.83);
        tl.to("#cA", { rotationY: 6, duration: f(1.2), ease: "sine.inOut" }, f(0.9));

        // ---- CARD B — rear pose: A swings away, B swings in; name lands on "Lauren" (2.75)
        tl.to("#cA", { rotationY: -75, x: -220, opacity: 0, filter: "blur(10px)", duration: f(0.37), ease: "power2.in" }, f(1.97));
        tl.fromTo("#cB", { opacity: 0, rotationY: 75, x: 220, rotationX: 4, filter: "blur(10px)" },
          { opacity: 1, rotationY: -14, x: 0, filter: "blur(0px)", duration: f(0.5), ease: "power3.out", immediateRender: false }, f(2.27));
        pop("cB", 2.67);
        kickOut("#k1", 2.5);
        kickIn("#k2", 2.7);
        tl.to("#cB", { rotationY: -6, duration: f(1.3), ease: "sine.inOut" }, f(2.8));

        // ---- CARD C — Ash + Lauren: swings in on "two days … back to back"
        tl.to("#cB", { rotationY: 75, x: 220, opacity: 0, filter: "blur(10px)", duration: f(0.37), ease: "power2.in" }, f(3.97));
        tl.fromTo("#cC", { opacity: 0, rotationY: -75, x: -220, rotationX: 4, filter: "blur(10px)" },
          { opacity: 1, rotationY: 12, x: 0, filter: "blur(0px)", duration: f(0.5), ease: "power3.out", immediateRender: false }, f(4.27));
        pop("cC", 4.67);
        kickOut("#k2", 4.13);
        kickIn("#k3", 4.3);
        tl.to("#cC", { rotationY: 4, duration: f(1.5), ease: "sine.inOut" }, f(4.8));

        // ---- OUT (6.47–6.97): sinks back into the floor; clean before the cut at 7.167
        tl.to("#cC", { y: 950, filter: "blur(14px)", duration: f(0.43), ease: "power2.in" }, f(6.47));
        tl.to(["#k3", "#rule"], { opacity: 0, y: 24, duration: f(0.3), ease: "power2.in" }, f(6.43));
        tl.to(["#slit", "#beam"], { opacity: 0, duration: f(0.27), ease: "power1.in" }, f(6.67));
        tl.to("#dim", { opacity: 0, duration: f(0.37), ease: "power1.inOut" }, f(6.63));

        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
