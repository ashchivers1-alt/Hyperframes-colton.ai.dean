<!doctype html><html lang="en"><head><meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" /><script src="assets/gsap.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1080px; height:1920px; overflow:hidden; background:transparent; }
#root { position:relative; width:1080px; height:1920px; overflow:hidden; }

#hm { position:absolute; left:540px; top:960px; width:0; height:0; }
.l { position:absolute; left:-5px; top:-74px; width:10px; height:46px; background:#fff; border-radius:2px;
     box-shadow:0 0 0 2px rgba(0,0,0,0.55), 0 0 10px rgba(0,0,0,0.5); transform-origin:5px 74px; }

</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="0.4" data-width="1080" data-height="1920"><div id="hm"><div class="l" style="transform:rotate(45deg)"></div><div class="l" style="transform:rotate(135deg)"></div><div class="l" style="transform:rotate(225deg)"></div><div class="l" style="transform:rotate(315deg)"></div></div></div>
<script>(() => { const tl = gsap.timeline({ paused:true });
gsap.set("#hm", { scale:1.45, opacity:1 });
tl.to("#hm", { scale:1, duration:0.07, ease:"power2.out" }, 0);
tl.to("#hm", { opacity:0, duration:0.14, ease:"power1.in" }, 0.24);
tl.to({}, { duration:0.4 }, 0); window.__timelines = window.__timelines || {}; window.__timelines["main"] = tl; })();</script>
</body></html>
