<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:3840px; height:2160px; overflow:hidden; background:transparent; }

<div id="stage" data-composition-id="main" data-start="0" data-duration="4.995" data-width="3840" data-height="2160"><div id="root"><div id="N" class="sh"><div class="pill">HOUSE RULES</div><div class="clip"><div class="t">NO PHONES ALLOWED IN TRAINING</div></div><div class="row"><div class="s">Caught in 4K</div><div class="st">LOL</div></div></div></div></div>
